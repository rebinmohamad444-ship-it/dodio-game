<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #12161f;
        }

        /* Compact Top Left Stats */
        #hud-top-left {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.65);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #2ecc71;
            font-size: 11px;
            z-index: 5;
            pointer-events: none;
        }

        /* Ultra Compact Top Right Leaderboard */
        #hud-top-right {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.65);
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #f1c40f;
            font-size: 10px;
            min-width: 95px;
            z-index: 5;
            pointer-events: none;
        }
        #hud-top-right h5 {
            color: #f1c40f;
            text-align: center;
            font-size: 10px;
            margin-bottom: 2px;
        }

        /* Bottom Right Radar & Champ Tag */
        #radar-wrapper {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            z-index: 5;
            pointer-events: none;
        }
        #champ-tag {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #f1c40f;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 9px;
            color: #f1c40f;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        #radar-canvas {
            width: 65px;
            height: 65px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #2ecc71;
            border-radius: 50%;
        }

        /* Power-up Status Indicators */
        #powerup-bar {
            position: absolute;
            top: 45px;
            left: 8px;
            display: flex;
            gap: 5px;
            z-index: 5;
            pointer-events: none;
        }
        .power-icon {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            padding: 4px;
            font-size: 12px;
            border: 1px solid #fff;
            display: none;
        }

        /* Main Menu Overlay */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        h1 { font-size: 36px; color: #2ecc71; margin-bottom: 10px; letter-spacing: 1px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 80%; max-width: 240px; }
        
        button, select, input {
            padding: 10px;
            font-size: 13px;
            border-radius: 15px;
            border: 1.5px solid #2ecc71;
            background: #181c24;
            color: #fff;
            text-align: center;
            outline: none;
        }
        button {
            background: #2ecc71;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button.fb-btn { background: #1877f2; color: #fff; }
        button.guest-btn { background: #282c34; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="hud-top-left">
    <div>Score: <span id="scoreVal" style="color:#2ecc71; font-weight:bold;">0</span></div>
    <div>Players: <span id="playersVal">1</span></div>
</div>

<div id="powerup-bar">
    <div id="magnet-status" class="power-icon" style="border-color:#3498db;">🧲</div>
    <div id="2x-status" class="power-icon" style="border-color:#e74c3c;">⚡2X</div>
</div>

<div id="hud-top-right">
    <h5>🏆 Top Players</h5>
    <div>1. 🥇 Shafeeq - 1200</div>
    <div>2. 🥈 Silva - 850</div>
    <div>3. 🥉 Leo - 640</div>
</div>

<div id="radar-wrapper">
    <div id="champ-tag">🏆 24h: <strong>Shafeeq</strong></div>
    <canvas id="radar-canvas" width="65" height="65"></canvas>
</div>

<!-- Menu -->
<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:35px; margin-bottom:10px;">🐍</div>
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name">
        
        <select id="skinSelect">
            <optgroup label="Regions & Nations ☀️">
                <option value="kurdish">✌️ Kurdistan</option>
                <option value="catalonia">🟡🔴 Catalonia</option>
                <option value="scotland">🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland</option>
            </optgroup>
            <optgroup label="World Countries 🌍">
                <option value="brazil">🇧🇷 Brazil</option>
                <option value="argentina">🇦🇷 Argentina</option>
                <option value="germany">🇩🇪 Germany</option>
                <option value="france">🇫🇷 France</option>
                <option value="spain">🇪🇸 Spain</option>
                <option value="italy">🇮🇹 Italy</option>
            </optgroup>
        </select>

        <button onclick="startGame()">Play Game 🎮</button>
        <button class="guest-btn" onclick="startGame()">Email Login ✉️</button>
        <button class="fb-btn" onclick="startGame()">Connect Facebook 📘</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');
    
    const MAP_SIZE = 2500;
    let gameRunning = false;
    let score = 0;
    let currentSkin = 'kurdish';
    let targetAngle = 0;
    let currentAngle = 0;

    let snake = [];
    let foods = [];
    let powerups = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function startGame() {
        currentSkin = document.getElementById('skinSelect').value;
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true;
        initGame();
        gameLoop();
    }

    function initGame() {
        snake = [];
        const startX = MAP_SIZE / 2;
        const startY = MAP_SIZE / 2;
        for(let i = 0; i < 20; i++) {
            snake.push({x: startX - i * 6, y: startY});
        }

        // Spawn Foods
        foods = [];
        for(let i = 0; i < 300; i++) {
            foods.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                size: Math.random() * 3 + 3,
                color: ['#2ecc71', '#e74c3c', '#f1c40f', '#3498db', '#e67e22'][Math.floor(Math.random()*5)]
            });
        }

        // Spawn Power-ups (🧲 Magnet & ⚡ 2X)
        powerups = [];
        for(let i = 0; i < 15; i++) {
            powerups.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                type: Math.random() > 0.5 ? 'magnet' : '2x'
            });
        }
    }

    // Controls: Touch/Mouse direction relative to screen center
    function handlePointer(e) {
        if(!gameRunning) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = clientX - canvas.width / 2;
        const dy = clientY - canvas.height / 2;
        targetAngle = Math.atan2(dy, dx);
    }
    window.addEventListener('touchmove', handlePointer);
    window.addEventListener('mousemove', handlePointer);

    function getSkinColors(skin) {
        switch(skin) {
            case 'kurdish': return ['#EE2324', '#FFFFFF', '#00A859', '#FE8200'];
            case 'catalonia': return ['#F1BF00', '#AA152B'];
            case 'scotland': return ['#0065BD', '#FFFFFF'];
            case 'brazil': return ['#009C3B', '#FFDF00', '#002776'];
            case 'argentina': return ['#74ACDF', '#FFFFFF'];
            case 'germany': return ['#000000', '#DD0000', '#FFCE00'];
            case 'france': return ['#002395', '#FFFFFF', '#ED2939'];
            case 'spain': return ['#AA152B', '#F1BF00'];
            case 'italy': return ['#009246', '#FFFFFF', '#CE2B37'];
            default: return ['#2ecc71'];
        }
    }

    function drawRadar(head) {
        radarCtx.clearRect(0, 0, 65, 65);
        
        // Draw player dot on radar
        const rx = (head.x / MAP_SIZE) * 65;
        const ry = (head.y / MAP_SIZE) * 65;
        radarCtx.fillStyle = '#2ecc71';
        radarCtx.beginPath();
        radarCtx.arc(rx, ry, 2.5, 0, Math.PI * 2);
        radarCtx.fill();
    }

    function gameLoop() {
        if(!gameRunning) return;

        // Smooth Turn
        let diff = targetAngle - currentAngle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        currentAngle += diff * 0.1;

        // Move Snake Head
        const speed = 3.2;
        let head = {
            x: snake[0].x + Math.cos(currentAngle) * speed,
            y: snake[0].y + Math.sin(currentAngle) * speed
        };

        // Keep inside bounds
        head.x = Math.max(10, Math.min(MAP_SIZE - 10, head.x));
        head.y = Math.max(10, Math.min(MAP_SIZE - 10, head.y));

        snake.unshift(head);
        snake.pop();

        // Check Food Collision
        foods.forEach((food, index) => {
            let dist = Math.hypot(head.x - food.x, head.y - food.y);
            if(dist < 15) {
                score += 5;
                document.getElementById('scoreVal').innerText = score;
                foods[index] = {
                    x: Math.random() * MAP_SIZE,
                    y: Math.random() * MAP_SIZE,
                    size: Math.random() * 3 + 3,
                    color: food.color
                };
                // Grow snake
                snake.push({...snake[snake.length - 1]});
            }
        });

        // CAMERA FOLLOW: Offset world by head position
        const camX = canvas.width / 2 - head.x;
        const camY = canvas.height / 2 - head.y;

        ctx.fillStyle = '#12161f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(camX, camY);

        // Draw Map Grid/Border
        ctx.strokeStyle = '#1e2532';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

        // Draw Foods
        foods.forEach(food => {
            ctx.fillStyle = food.color;
            ctx.beginPath();
            ctx.arc(food.x, food.y, food.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Power-ups (🧲 & ⚡)
        powerups.forEach(p => {
            ctx.font = "14px Arial";
            ctx.fillText(p.type === 'magnet' ? '🧲' : '⚡', p.x, p.y);
        });

        // Draw Snake Body
        const colors = getSkinColors(currentSkin);
        for(let i = snake.length - 1; i >= 0; i--) {
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.arc(snake[i].x, snake[i].y, i === 0 ? 10 : 8, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();

        // Update Radar
        drawRadar(head);

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
