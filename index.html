<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        canvas {
            background: #222;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .stats {
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #4CAF50;
            width: fit-content;
        }
        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }
        h1 {
            font-size: 42px;
            color: #4CAF50;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        .snake-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #4CAF50;
            border-radius: 25px;
            outline: none;
            background: #222;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            width: 80%;
            max-width: 280px;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: #4CAF50;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="stats">
            <div>Score: <span id="scoreVal">0</span></div>
            <div>Online Players: <span id="playersVal">1</span></div>
        </div>
    </div>

    <div id="menu-overlay">
        <h1>dod.io</h1>
        <div class="snake-icon">🐍</div>
        <input type="text" id="playerName" value="Shafeeq" placeholder="Enter Nickname">
        <button id="startBtn">PLAY ONLINE 🌐</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menu-overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreVal = document.getElementById('scoreVal');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let gameRunning = false;
    let score = 0;
    let snake = [{x: canvas.width/2, y: canvas.height/2}];
    let food = {x: 100, y: 100};
    let dir = {x: 2, y: 0};

    function spawnFood() {
        food.x = Math.random() * (canvas.width - 40) + 20;
        food.y = Math.random() * (canvas.height - 40) + 20;
    }

    startBtn.addEventListener('click', () => {
        menuOverlay.style.display = 'none';
        gameRunning = true;
        spawnFood();
        gameLoop();
    });

    // Touch control for mobile
    window.addEventListener('touchmove', (e) => {
        if(!gameRunning) return;
        let touch = e.touches[0];
        let head = snake[0];
        let dx = touch.clientX - head.x;
        let dy = touch.clientY - head.y;
        let angle = Math.atan2(dy, dx);
        dir.x = Math.cos(angle) * 3;
        dir.y = Math.sin(angle) * 3;
    });

    function gameLoop() {
        if(!gameRunning) return;

        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Move head
        let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
        snake.unshift(head);

        // Eat food
        let dist = Math.hypot(head.x - food.x, head.y - food.y);
        if(dist < 20) {
            score += 10;
            scoreVal.innerText = score;
            spawnFood();
        } else {
            snake.pop();
        }

        // Draw food
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.arc(food.x, food.y, 8, 0, Math.PI * 2);
        ctx.fill();

        // Draw snake
        ctx.fillStyle = '#4CAF50';
        snake.forEach((part, index) => {
            ctx.beginPath();
            ctx.arc(part.x, part.y, index === 0 ? 12 : 10, 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(gameLoop);
    }
</script>

</body>
</html>
