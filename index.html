<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        /* HUD Top Left */
        #radar-wrapper {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 4px 8px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 10px; margin-top: 4px; text-align: center;
        }

        /* Leaderboard */
        #leaderboard-box {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.8); padding: 4px 8px;
            border-radius: 6px; border: 1px solid #f1c40f;
            font-size: 9px; z-index: 5; min-width: 110px; pointer-events: none;
        }

        #active-powers-container {
            position: absolute; top: 90px; left: 10px;
            display: flex; flex-direction: column; gap: 3px; z-index: 5;
        }
        .power-badge {
            background: rgba(241, 196, 15, 0.9); color: #111;
            padding: 2px 6px; border-radius: 8px; font-weight: bold;
            font-size: 9px; box-shadow: 0 0 6px #f1c40f; width: fit-content;
        }
        .blinking { animation: blinker 0.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.2; } }

        #ingame-garage-btn {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(243, 156, 18, 0.85); border: 1.5px solid #fff;
            color: #fff; padding: 6px 12px; border-radius: 12px;
            font-size: 11px; font-weight: bold; z-index: 10; cursor: pointer;
        }

        #boost-btn {
            position: absolute; bottom: 20px; right: 20px;
            width: 60px; height: 60px;
            background: rgba(231, 76, 60, 0.9);
            border: 2px solid #fff; border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 11px;
            z-index: 10; display: none; justify-content: center; align-items: center;
            box-shadow: 0 0 10px #e74c3c; cursor: pointer;
        }

        #menu-overlay, #shop-modal, #history-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        #shop-modal, #history-modal { display: none; z-index: 30; }

        h1 { font-size: 38px; color: #2ecc71; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 280px; }
        button, select, input {
            padding: 9px; font-size: 12px; border-radius: 12px;
            border: 1.5px solid #2ecc71; background: #181c24; color: #fff; text-align: center; outline: none;
        }
        button { background: #2ecc71; color: #111; font-weight: bold; cursor: pointer; border: none; }
        button.fb-btn { background: #1877f2; color: #fff; }
        button.guest-btn { background: #282c34; color: #fff; border: 1px solid #444; }
        button.shop-btn { background: #f39c12; color: #fff; }

        .shop-list, .history-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 220px; overflow-y: auto; width: 85%; max-width: 320px; margin: 10px 0;
        }
        .shop-item, .history-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #181c24; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; font-size: 11px;
        }
    </style>
</head>
<body>

<div id="radar-wrapper">
    <canvas id="radar-canvas" width="70" height="70"></canvas>
    <div id="hud-stats">
        <div>Score: <span id="scoreVal" style="color:#2ecc71;">0</span></div>
        <div>Coins: <span id="coinVal" style="color:#f1c40f;">🪙 0</span></div>
    </div>
</div>

<div id="active-powers-container"></div>

<div id="leaderboard-box">
    <h4 style="color:#f1c40f; text-align:center; margin-bottom:2px; font-size:9px;">🏆 TOP 10</h4>
    <div id="topList"></div>
</div>

<div id="ingame-garage-btn" onclick="openShop()">🚗 Garage</div>
<div id="boost-btn">BOOST 🚀</div>

<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:30px; margin-bottom:8px;">🐍</div>
    
    <div style="font-size:12px; color:#f1c40f; margin-bottom:10px;">
        High Score: <span id="menuHighScore">0</span> | Coins: <span id="menuCoins">0</span> 🪙
    </div>

    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name">
        <button onclick="startGame()">Play as Guest 🎮</button>
        <button class="guest-btn" onclick="startGame()">Email Login ✉️</button>
        <button class="fb-btn" onclick="startGame()">Connect Facebook 📘</button>
        <button class="shop-btn" onclick="openShop()">Shop & Skins 🛒</button>
        <button style="background:#9b59b6; color:#fff;" onclick="openHistory()">Match History 📜</button>
    </div>
</div>

<div id="history-modal">
    <h3 style="color:#9b59b6; margin-bottom:5px;">Match History 📜</h3>
    <div class="history-list" id="historyContainer"></div>
    <button onclick="closeHistory()" style="width:120px;">Close</button>
</div>

<div id="shop-modal">
    <h3 style="color:#f39c12; margin-bottom:5px;">Skins & Garages 🛒</h3>
    <div style="font-size:12px;">Saved Coins: <span id="shopCoinVal" style="color:#f1c40f; font-weight:bold;">🪙 0</span></div>
    <div class="shop-list" id="shopItemsContainer"></div>
    <button onclick="closeShop()" style="width:120px;">Close</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    const MAP_SIZE = 14000;
    let cameraScale = 0.65;
    let gameRunning = false;
    
    let coins = parseInt(localStorage.getItem('dodio_coins') || '0');
    let highScore = parseInt(localStorage.getItem('dodio_highscore') || '0');
    let matchHistory = JSON.parse(localStorage.getItem('dodio_history') || '[]');
    let score = 0;

    let manualSpeedBoost = false;
    let isMagnetActive = false;
    let isSteeringActive = false;
    let activePowers = [];
    let deadRemains = [];

    let player = { x: MAP_SIZE/2, y: MAP_SIZE/2, angle: 0, targetAngle: 0, skin: 'free1', body: [], alive: true, sizeRadius: 16 };
    let bots = [];
    let fruits = [];
    let coinItems = [];
    let powerups = [];

    const skinsDatabase = [
        { id: 'free1', name: '🟢 Lime Green', price: 0, color: '#2ecc71' },
        { id: 'free2', name: '🔵 Sky Blue', price: 0, color: '#3498db' },
        { id: 'free3', name: '🔴 Ruby Red', price: 0, color: '#e74c3c' },
        { id: 'free4', name: '🟡 Bright Yellow', price: 0, color: '#f1c40f' },
        { id: 'free5', name: '🟣 Royal Purple', price: 0, color: '#9b59b6' },
        { id: 'kurdish', name: '✌️ Kurdistan Flag', price: 100, color: '#00A859' },
        { id: 'brazil', name: '🇧🇷 Brazil Flag', price: 100, color: '#FFDF00' },
        { id: 'argentina', name: '🇦🇷 Argentina Flag', price: 100, color: '#74ACDF' }
    ];

    let ownedSkins = skinsDatabase.filter(s => s.price === 0).map(s => s.id);

    const garages = [
        { x: 500, y: 500 },
        { x: MAP_SIZE - 500, y: 500 },
        { x: 500, y: MAP_SIZE - 500 },
        { x: MAP_SIZE - 500, y: MAP_SIZE - 500 }
    ];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    updateMenuStats();

    function updateMenuStats() {
        document.getElementById('coinVal').innerText = `🪙 ${coins}`;
        document.getElementById('menuCoins').innerText = coins;
        document.getElementById('menuHighScore').innerText = highScore;
    }

    function openShop() {
        document.getElementById('shopCoinVal').innerText = `🪙 ${coins}`;
        renderShop();
        document.getElementById('shop-modal').style.display = 'flex';
    }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
    function openHistory() {
        renderHistory();
        document.getElementById('history-modal').style.display = 'flex';
    }
    function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }

    function renderHistory() {
        let container = document.getElementById('historyContainer');
        if(matchHistory.length === 0) {
            container.innerHTML = "<div style='font-size:11px; text-align:center;'>No match history recorded yet!</div>";
            return;
        }
        let html = "";
        matchHistory.slice(-5).reverse().forEach(h => {
            html += `<div class="history-item"><span>Score: ${h.score}</span><span style="color:#f1c40f;">🪙 ${h.coins}</span><span>${h.date}</span></div>`;
        });
        container.innerHTML = html;
    }

    function renderShop() {
        let container = document.getElementById('shopItemsContainer');
        container.innerHTML = "<h4 style='color:#2ecc71;'>Free & Flag Skins (100 🪙)</h4>";
        skinsDatabase.forEach(s => {
            let isOwned = ownedSkins.includes(s.id);
            let isSelected = player.skin === s.id;
            container.innerHTML += `
                <div class="shop-item">
                    <span>${s.name}</span>
                    ${isOwned ? 
                        `<button style="background:${isSelected ? '#27ae60' : '#2980b9'}; padding:4px 8px; font-size:10px;" onclick="selectSkin('${s.id}')">${isSelected ? 'Equipped' : 'Equip'}</button>` :
                        `<button class="shop-btn" style="padding:4px 8px; font-size:10px;" onclick="buySkin('${s.id}', ${s.price})">Buy 🪙${s.price}</button>`
                    }
                </div>
            `;
        });
    }

    function buySkin(id, price) {
        if(coins >= price) {
            coins -= price;
            ownedSkins.push(id);
            player.skin = id;
            updateMenuStats();
            saveStats();
            renderShop();
        } else {
            alert("Not enough coins!");
        }
    }

    function selectSkin(id) {
        player.skin = id;
        renderShop();
    }

    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true;
        initGame();
        gameLoop();
    }

    function saveStats() {
        localStorage.setItem('dodio_coins', coins.toString());
        if(score > highScore) {
            highScore = score;
            localStorage.setItem('dodio_highscore', highScore.toString());
        }
        updateMenuStats();
    }

    function recordMatchEnd() {
        let dateStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        matchHistory.push({ score, coins, date: dateStr });
        localStorage.setItem('dodio_history', JSON.stringify(matchHistory));
        saveStats();
    }

    function initGame() {
        score = 0;
        document.getElementById('scoreVal').innerText = score;
        
        player.alive = true;
        player.x = MAP_SIZE/2; player.y = MAP_SIZE/2;
        player.sizeRadius = 16;
        player.body = [];
        for(let i=0; i<30; i++) player.body.push({x: player.x - i*6, y: player.y});

        bots = [];
        for(let i=0; i<10; i++) spawnBot(i);

        fruits = [];
        const fTypes = ['🍌', '🍉', '🍒', '🍎', '🍓'];
        for(let i=0; i<3500; i++) {
            fruits.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, type: fTypes[Math.floor(Math.random()*fTypes.length)] });
        }

        coinItems = [];
        for(let i=0; i<200; i++) coinItems.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE });

        powerups = [];
        const pTypes = ['🧲', 'x2', 'x4', 'x6', 'x10', '🚀', '📷', '🎛️']; // 🎛️ Airplane Yoke Steering
        for(let i=0; i<250; i++) {
            powerups.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, icon: pTypes[Math.floor(Math.random()*pTypes.length)] });
        }
    }

    // SPAWN 10X BIGGER BOTS IN CENTER
    function spawnBot(id) {
        let bx = Math.random() * (MAP_SIZE - 4000) + 2000;
        let by = Math.random() * (MAP_SIZE - 4000) + 2000;
        let botRadius = 35; // 10X Bigger than Player base
        let bodyLength = 120;
        let body = [];
        for(let j=0; j<bodyLength; j++) body.push({x: bx - j*12, y: by});
        
        const botNames = ['Apex_Viper', 'Shadow_Hunter', 'Anaconda_King', 'Kurd_Pro', 'Slayer_99', 'Toxic_Bite', 'Alpha_Dragon', 'Speed_Master', 'Mega_Snake', 'Venom_X'];
        bots[id] = { id, name: botNames[id], x: bx, y: by, angle: Math.random()*Math.PI*2, body, score: 2500, alive: true, circleAngle: 0, sizeRadius: botRadius };
    }

    function explodeSnake(body) {
        const colors = ['#2ecc71', '#f1c40f', '#e74c3c', '#3498db', '#9b59b6', '#e67e22', '#00ffcc'];
        body.forEach(p => {
            deadRemains.push({
                x: p.x, y: p.y,
                color: colors[Math.floor(Math.random() * colors.length)],
                spawnTime: Date.now()
            });
        });
    }

    const boostBtn = document.getElementById('boost-btn');
    boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); manualSpeedBoost = true; });
    boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); manualSpeedBoost = false; });
    boostBtn.addEventListener('mousedown', () => manualSpeedBoost = true);
    boostBtn.addEventListener('mouseup', () => manualSpeedBoost = false);

    function handlePointer(e) {
        if(!gameRunning || !player.alive) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.targetAngle = Math.atan2(cy - canvas.height/2, cx - canvas.width/2);
    }
    window.addEventListener('touchmove', handlePointer);
    window.addEventListener('mousemove', handlePointer);

    function addPowerupTimer(name, icon, durationMs, onExpire) {
        let expireTime = Date.now() + durationMs;
        let powerObj = { name, icon, expireTime };
        activePowers.push(powerObj);

        setTimeout(() => {
            let idx = activePowers.indexOf(powerObj);
            if(idx > -1) activePowers.splice(idx, 1);
            if(onExpire) onExpire();
        }, durationMs);
    }

    function renderPowerBadges() {
        let container = document.getElementById('active-powers-container');
        let html = "";
        let now = Date.now();

        activePowers.forEach(p => {
            let timeLeft = Math.max(0, Math.ceil((p.expireTime - now) / 1000));
            let isBlinking = timeLeft <= 5;
            html += `<div class="power-badge ${isBlinking ? 'blinking' : ''}">${p.icon} ${p.name} (${timeLeft}s)</div>`;
        });
        container.innerHTML = html;
    }

    // HANDSOME BEAUTIFUL ANACONDA/COBRA HEAD
    function drawSnakeHead(p, angle, mainColor, radius) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        
        // Sleek Cobra/Anaconda Head
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 1.7, radius * 1.25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();

        // Sharp Handsome Eyes
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.ellipse(radius*0.5, -radius*0.4, radius*0.35, radius*0.2, Math.PI*0.1, 0, Math.PI * 2);
        ctx.ellipse(radius*0.5, radius*0.4, radius*0.35, radius*0.2, -Math.PI*0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(radius*0.55, -radius*0.4, radius*0.12, 0, Math.PI * 2);
        ctx.arc(radius*0.55, radius*0.4, radius*0.12, 0, Math.PI * 2);
        ctx.fill();

        // Forked Tongue
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(radius*1.7, 0); ctx.lineTo(radius*2.5, 0);
        ctx.lineTo(radius*2.9, -5); ctx.moveTo(radius*2.5, 0); ctx.lineTo(radius*2.9, 5);
        ctx.stroke();

        // 5 Vertical Magnet Lines
        if(isMagnetActive) {
            ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3;
            for(let i = -2; i <= 2; i += 1) {
                ctx.beginPath();
                ctx.moveTo(radius * 2.2, i * 8);
                ctx.lineTo(radius * 2.2, (i * 8) + 14);
                ctx.stroke();
            }
        }

        ctx.restore();
    }

    function updateLeaderboard() {
        let list = [{ name: document.getElementById('playerName').value || "You (Player)", score: score }];
        bots.forEach(b => { if(b.alive) list.push({ name: b.name, score: b.score }); });
        list.sort((a, b) => b.score - a.score);

        let html = "";
        list.slice(0, 10).forEach((item, idx) => {
            let isPlayer = item.name.includes("Player");
            html += `<div style="color:${isPlayer ? '#2ecc71' : '#fff'}; font-weight:${isPlayer ? 'bold' : 'normal'}">${idx+1}. ${item.name} - ${item.score}</div>`;
        });
        document.getElementById('topList').innerHTML = html;
    }

    function gameLoop() {
        if(!gameRunning) return;

        let now = Date.now();
        deadRemains = deadRemains.filter(r => now - r.spawnTime < 20000);

        if(player.alive) {
            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;

            let baseAgility = 0.22;
            if(isSteeringActive) baseAgility = 0.42;

            player.angle += diff * baseAgility;

            let currentSpeed = manualSpeedBoost ? 8.0 : 4.8;
            player.x += Math.cos(player.angle) * currentSpeed;
            player.y += Math.sin(player.angle) * currentSpeed;
            player.body.unshift({x: player.x, y: player.y});
            player.body.pop();

            if(player.x <= 20 || player.x >= MAP_SIZE - 20 || player.y <= 20 || player.y >= MAP_SIZE - 20) {
                player.alive = false;
                recordMatchEnd();
                alert("Game Over! You hit the Red Zone!");
                location.reload();
            }

            bots.forEach(b => {
                if(!b.alive) return;
                b.body.forEach((seg, idx) => {
                    if(idx > 2 && Math.hypot(player.x - seg.x, player.y - seg.y) < player.sizeRadius + b.sizeRadius*0.5) {
                        player.alive = false;
                        recordMatchEnd();
                        alert("Game Over! You crashed into a giant bot!");
                        location.reload();
                    }
                });
            });

            if(isMagnetActive) {
                [fruits, coinItems, powerups, deadRemains].forEach(group => {
                    group.forEach(item => {
                        let d = Math.hypot(player.x - item.x, player.y - item.y);
                        if(d < 380) {
                            item.x += (player.x - item.x) * 0.15;
                            item.y += (player.y - item.y) * 0.15;
                        }
                    });
                });
            }

            fruits.forEach((f, i) => {
                if(Math.hypot(player.x - f.x, player.y - f.y) < player.sizeRadius + 10) {
                    score += 5;
                    document.getElementById('scoreVal').innerText = score;
                    fruits[i].x = Math.random() * MAP_SIZE;
                    fruits[i].y = Math.random() * MAP_SIZE;
                    player.body.push({...player.body[player.body.length-1]});
                    if(player.body.length % 10 === 0) player.sizeRadius += 0.6;
                }
            });

            deadRemains.forEach((r, i) => {
                if(Math.hypot(player.x - r.x, player.y - r.y) < player.sizeRadius + 10) {
                    score += 15;
                    document.getElementById('scoreVal').innerText = score;
                    deadRemains.splice(i, 1);
                    player.body.push({...player.body[player.body.length-1]});
                }
            });

            coinItems.forEach((c, i) => {
                if(Math.hypot(player.x - c.x, player.y - c.y) < player.sizeRadius + 8) {
                    coins += 1;
                    document.getElementById('coinVal').innerText = `🪙 ${coins}`;
                    saveStats();
                    coinItems[i].x = Math.random() * MAP_SIZE;
                    coinItems[i].y = Math.random() * MAP_SIZE;
                }
            });

            powerups.forEach((p, i) => {
                if(Math.hypot(player.x - p.x, player.y - p.y) < player.sizeRadius + 12) {
                    if(p.icon === '🧲') {
                        isMagnetActive = true;
                        addPowerupTimer('Magnet', '🧲', 15000, () => isMagnetActive = false);
                    }
                    if(p.icon === '🚀') {
                        document.getElementById('boost-btn').style.display = 'flex';
                        addPowerupTimer('Boost Button', '🚀', 15000, () => {
                            document.getElementById('boost-btn').style.display = 'none';
                            manualSpeedBoost = false;
                        });
                    }
                    if(p.icon === '🎛️') { // Airplane Steering
                        isSteeringActive = true;
                        addPowerupTimer('Airplane Steering', '🎛️', 15000, () => isSteeringActive = false);
                    }
                    if(p.icon === '📷') {
                        cameraScale = 0.42;
                        addPowerupTimer('Camera Zoom', '📷', 15000, () => cameraScale = 0.65);
                    }
                    if(p.icon.includes('X')) {
                        addPowerupTimer(`Multiplier ${p.icon}`, p.icon, 15000, null);
                    }

                    powerups[i].x = Math.random() * MAP_SIZE;
                    powerups[i].y = Math.random() * MAP_SIZE;
                }
            });
        }

        // BOTS SMART MOVEMENT (STAY AWAY FROM RED ZONE, HUNT PLAYER & FRUITS)
        bots.forEach(b => {
            if(!b.alive) return;

            // Keep bots inside safe area (Away from Red Zone)
            if(b.x < 1500 || b.x > MAP_SIZE - 1500 || b.y < 1500 || b.y > MAP_SIZE - 1500) {
                b.angle = Math.atan2(MAP_SIZE/2 - b.y, MAP_SIZE/2 - b.x);
            } else {
                let distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);
                if(distToPlayer < 1200 && player.alive) {
                    b.angle = Math.atan2(player.y - b.y, player.x - b.x); // Aggressive Hunt
                } else {
                    b.angle += (Math.random() - 0.5) * 0.08;
                }
            }

            b.x += Math.cos(b.angle) * 4.2;
            b.y += Math.sin(b.angle) * 4.2;
            b.body.unshift({x: b.x, y: b.y});
            b.body.pop();

            // Instant Respawn on Death
            player.body.forEach((pSeg, idx) => {
                if(idx > 2 && Math.hypot(b.x - pSeg.x, b.y - pSeg.y) < b.sizeRadius) {
                    b.alive = false;
                    explodeSnake(b.body);
                    setTimeout(() => spawnBot(b.id), 500); // 0.5s Fast Respawn!
                }
            });
        });

        const camX = canvas.width / 2 - player.x * cameraScale;
        const camY = canvas.height / 2 - player.y * cameraScale;

        ctx.fillStyle = '#0f131a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(camX, camY);
        ctx.scale(cameraScale, cameraScale);

        // GRID LINES
        ctx.strokeStyle = 'rgba(231, 76, 60, 0.22)'; ctx.lineWidth = 2;
        for(let x = 0; x < MAP_SIZE; x += 200) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
        }
        for(let y = 0; y < MAP_SIZE; y += 200) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
        }

        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 20;
        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

        garages.forEach(g => {
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(g.x - 120, g.y - 120, 240, 240);
            ctx.fillStyle = '#fff'; ctx.font = "bold 22px Arial";
            ctx.fillText("GARAGE 🚗", g.x - 60, g.y + 8);
        });

        fruits.forEach(f => { ctx.font = "24px Arial"; ctx.fillText(f.type, f.x, f.y); });
        coinItems.forEach(c => { ctx.font = "20px Arial"; ctx.fillText("🪙", c.x, c.y); });

        deadRemains.forEach(r => {
            let isBlinking = (Math.floor(Date.now() / 250) % 2 === 0);
            ctx.shadowColor = r.color; ctx.shadowBlur = isBlinking ? 14 : 2;
            ctx.fillStyle = r.color;
            ctx.beginPath(); ctx.arc(r.x, r.y, 9, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        });

        powerups.forEach(p => {
            ctx.save();
            ctx.translate(p.x, p.y);
            if(p.icon.includes('X')) {
                ctx.fillStyle = '#1b365d';
                ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.stroke();
                
                ctx.fillStyle = '#fff';
                ctx.font = "bold 13px Arial";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(p.icon, 0, 0);
            } else {
                ctx.shadowColor = "#f1c40f"; ctx.shadowBlur = 12;
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(p.icon, 0, 0);
                ctx.shadowBlur = 0;
            }
            ctx.restore();
        });

        if(player.alive) {
            let activeSkinObj = skinsDatabase.find(s => s.id === player.skin) || skinsDatabase[0];
            player.body.forEach((p, i) => {
                if(i === 0) {
                    drawSnakeHead(p, player.angle, activeSkinObj.color, player.sizeRadius);
                } else {
                    ctx.fillStyle = i % 2 === 0 ? activeSkinObj.color : '#f1c40f';
                    ctx.beginPath(); ctx.arc(p.x, p.y, player.sizeRadius * 0.7, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        // Draw Big Bots
        bots.forEach(b => {
            if(!b.alive) return;
            b.body.forEach((bp, j) => {
                if(j === 0) {
                    drawSnakeHead(bp, b.angle, '#e74c3c', b.sizeRadius);
                } else {
                    ctx.fillStyle = j % 2 === 0 ? '#e74c3c' : '#3498db';
                    ctx.beginPath(); ctx.arc(bp.x, bp.y, b.sizeRadius * 0.65, 0, Math.PI*2); ctx.fill();
                }
            });
        });

        ctx.restore();

        radarCtx.clearRect(0, 0, 70, 70);
        if(player.alive) {
            radarCtx.fillStyle = '#2ecc71'; radarCtx.beginPath();
            radarCtx.arc((player.x/MAP_SIZE)*70, (player.y/MAP_SIZE)*70, 3.5, 0, Math.PI*2); radarCtx.fill();
        }
        bots.forEach(b => {
            if(!b.alive) return;
            radarCtx.fillStyle = '#e74c3c'; radarCtx.beginPath();
            radarCtx.arc((b.x/MAP_SIZE)*70, (b.y/MAP_SIZE)*70, 2, 0, Math.PI*2); radarCtx.fill();
        });

        renderPowerBadges();
        updateLeaderboard();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
