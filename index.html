<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanshen.io</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Shop Modal -->
    <div id="shop-modal" style="display:none; position:absolute; top:20px; left:20px; background:#222; color:#fff; padding:20px; border-radius:10px; width:300px;">
        <h3 style="color:#f39c12;">Shop</h3>
        <div id="shop-tabs">
            <button class="shop-tab-btn" onclick="renderShopUI('skins')">Skins</button>
            <button class="shop-tab-btn" onclick="renderShopUI('flags')">Flags</button>
            <button class="shop-tab-btn" onclick="renderShopUI('garage')">Garage</button>
        </div>
        <div id="shop-list" class="shop-list"></div>
        
        <!-- ئەم بەشە زۆر گرنگە بۆ Leaderboard! -->
        <div id="leaderboard-container" style="margin-top: 20px; border-top: 1px solid #555; padding-top: 10px;">
            <h4 style="color:#ddd;">Leaderboard</h4>
            <div id="leaderboard-list"></div>
        </div>
        
        <button onclick="closeShop()" style="margin-top:15px; background:#e74c3c; color:#fff; border:none; padding:8px 12px; cursor:pointer;">Close Shop</button>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="player.js"></script>
    <script src="bot.js"></script>
    <script src="items.js"></script>
    <script src="shop.js"></script>
    <script src="network.js"></script>
    <script src="ui-manager.js"></script>
    <script src="game-core.js"></script>
</body>
</html>
