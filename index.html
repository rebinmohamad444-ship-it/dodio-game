<link rel="manifest" href="/manifest.json">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100vw; height: 100vh;
            background-color: #0b0d12;
            color: #fff; font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        /* HUD Top Left */
        #radar-wrapper {
            position: absolute; top: 8px; left: 8px;
            display: flex; flex-direction: column; align-items: flex-start;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 65px; height: 65px;
            background: rgba(0, 0, 0, 0.85);
            border: 1.5px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 3px 6px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 9px; text-align: left; width: 65px;
        }

        #emoji-reaction-box {
            display: flex; flex-direction: row; gap: 4px; margin-top: 2px;
        }
        .reaction-btn {
            width: 28px; height: 28px; background: rgba(0,0,0,0.8);
            border: 1px solid #f1c40f; border-radius: 50%; font-size: 14px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        #left-bottom-container {
            position: absolute; bottom: 12px; left: 12px;
            display: flex; flex-direction: column; gap: 4px; z-index: 10;
        }
        #ingame-garage-btn {
            background: rgba(243, 156, 18, 0.9); border: 1px solid #fff;
            color: #fff; padding: 5px 8px; border-radius: 8px;
            font-size: 10px; font-weight: bold; cursor: pointer; text-align: center; width: 75px;
        }
        #exit-btn {
            background: #e74c3c; color: #fff; font-weight: bold;
            border: 1px solid #fff; padding: 5px 8px; border-radius: 8px;
            font-size: 10px; cursor: pointer; text-align: center; width: 75px;
        }

        #joystick-zone {
            position: absolute; width: 70px; height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(46, 204, 113, 0.8);
            border-radius: 50%; z-index: 10; display: none;
            pointer-events: none; transform: translate(-50%, -50%);
        }
        #joystick-knob {
            position: absolute; top: 18px; left: 18px;
            width: 34px; height: 34px;
            background: #2ecc71; border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71; pointer-events: none;
        }

        #btn-controls {
            position: absolute; bottom: 20px; right: 20px;
            display: none; grid-template-columns: repeat(3, 36px);
            grid-template-rows: repeat(3, 36px); gap: 4px; z-index: 10;
        }
        .ctrl-btn {
            background: rgba(46, 204, 113, 0.75); border: 1px solid #fff;
            color: #fff; font-weight: bold; border-radius: 6px; font-size: 13px;
        }

        #red-zone-alert {
            position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%);
            color: #e74c3c; font-size: 13px; font-weight: bold;
            background: rgba(0,0,0,0.85); padding: 4px 10px; border-radius: 6px;
            border: 1.5px solid #e74c3c; display: none; z-index: 8;
            animation: blinker 0.5s linear infinite;
        }

        #garage-safe-status {
            position: absolute; top: 12%; left: 50%; transform: translate(-50%, -50%);
            color: #2ecc71; font-size: 13px; font-weight: bold;
            background: rgba(0,0,0,0.92); padding: 8px 14px; border-radius: 10px;
            border: 2px solid #2ecc71; display: none; z-index: 8; text-align: center;
        }
        #exit-garage-btn {
            background: #e74c3c; color: #fff; font-size: 11px; font-weight: bold;
            padding: 5px 12px; border-radius: 6px; border: 1px solid #fff;
            cursor: pointer; margin-top: 5px; display: inline-block;
        }

        #leaderboard-box {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.85); padding: 5px 8px;
            border-radius: 6px; border: 1px solid #f1c40f;
            font-size: 8px; z-index: 5; min-width: 110px; pointer-events: none;
        }

        #active-powers-container {
            position: absolute; top: 175px; left: 8px;
            display: flex; flex-direction: column; gap: 3px; z-index: 5;
        }
