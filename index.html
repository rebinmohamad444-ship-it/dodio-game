<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        /* HUD Top Left */
        #radar-wrapper {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 75px; height: 75px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 4px 8px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 10px; margin-top: 4px; text-align: center;
        }
        #garage-info {
            font-size: 9px; color: #f39c12; background: rgba(0,0,0,0.8);
            padding: 3px 6px; border-radius: 4px; border: 1px solid #f39c12; margin-top: 2px;
        }

        #danger-banner {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9); color: #fff; padding: 5px 12px;
            border-radius: 15px; font-weight: bold; font-size: 12px; z-index: 10;
            display: none; animation: flashWarn 0.5s infinite alternate;
        }
        @keyframes flashWarn {
            from { opacity: 1; box-shadow: 0 0 10px #e74c3c; }
            to { opacity: 0.2; box-shadow: none; }
        }

        #leaderboard-box {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.85); padding: 6px 10px;
            border-radius: 8px; border: 1.5px solid #f1c40f;
            font-size: 10px; z-index: 5; min-width: 125px; pointer-events: none;
        }

        #multiplier-badge {
            position: absolute; top: 110px; left: 10px;
            background: rgba(241, 196, 15, 0.95); color: #111;
            padding: 4px 10px; border-radius: 12px; font-weight: bold;
            font-size: 11px; z-index: 5; display: none;
            box-shadow: 0 0 10px #f1c40f;
        }

        /* Controls */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 100px; height: 100px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(46, 204, 113, 0.6);
            border-radius: 50%; z-index: 10; display: none;
        }
        #btn-controls {
            position: absolute; bottom: 30px; left: 30px;
            display: none; grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px); gap: 4px; z-index: 10;
        }
        .ctrl-btn {
            background: rgba(46, 204, 113, 0.7); border: none;
            color: #fff; font-weight: bold; border-radius: 6px;
        }

        #boost-btn {
            position: absolute; bottom: 35px; right: 25px;
            width: 55px; height: 55px;
            background: rgba(231, 76, 60, 0.85);
            border: 2px solid #fff; border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 11px;
            z-index: 10; display: none; justify-content: center; align-items: center;
            box-shadow: 0 0 10px #e74c3c;
        }

        /* Menus */
        #menu-overlay, #shop-modal, #email-modal, #settings-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        #shop-modal, #email-modal, #settings-modal { display: none; z-index: 30; }

        h1 { font-size: 38px; color: #2ecc71; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 260px; }
        button, select, input {
            padding: 9px; font-size: 12px; border-radius: 12px;
            border: 1.5px solid #2ecc71; background: #181c24; color: #fff; text-align: center; outline: none;
        }
        button { background: #2ecc71; color: #111; font-weight: bold; cursor: pointer; border: none; }
        button.shop-btn { background: #f39c12; color: #fff; }
        button.guest-btn { background: #282c34; color: #fff; border: 1px solid #444; }

        .shop-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 250px; overflow-y: auto; width: 85%; max-width: 310px; margin: 12px 0;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #181c24; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; font-size: 11px;
        }
    </style>
</head>
<body>

<div id="danger-banner">⚠️ RED ZONE WARNING! ⚠️</div>

<div id="radar-wrapper">
    <canvas id="radar-canvas" width="75" height="75"></canvas>
    <div id="hud-stats">
        <div>Score: <span id="scoreVal" style="color:#2ecc71;">0</span></div>
        <div>Coins: <span id="coinVal" style="color:#f1c40f;">🪙 0</span></div>
    </div>
    <div id="garage-info">🚗 4 Garages Active</div>
</div>

<div id="multiplier-badge">⚡ 1X</div>

<div id="leaderboard-box">
    <h4 style="color:#f1c40f; text-align:center; margin-bottom:4px; font-size:10px;">🏆 TOP 10 PLAYERS</h4>
    <div id="topList"></div>
</div>

<div id="joystick-zone"></div>
<div id="btn-controls">
    <div></div><button class="ctrl-btn" onclick="setDir(0, -1)">▲</button><div></div>
    <button class="ctrl-btn" onclick="setDir(-1, 0)">◀</button><div></div><button class="ctrl-btn" onclick="setDir(1, 0)">▶</button>
    <div></div><button class="ctrl-btn" onclick="setDir(0, 1)">▼</button><div></div>
</div>
<div id="boost-btn">BOOST</div>

<!-- Main Menu Overlay -->
<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:30px; margin-bottom:8px;">🐍</div>
    
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name">
        <button onclick="startGame()">Play as Guest 🎮</button>
        <button class="guest-btn" onclick="openEmailModal()">Email Login ✉️</button>
        <button class="shop-btn" onclick="openShop()">Shop & Skins 🛒</button>
        <button style="background:#e67e22; color:#fff;" onclick="openSettings()">Settings ⚙️</button>
    </div>
</div>

<!-- Email Modal -->
<div id="email-modal">
    <h3 style="color:#2ecc71; margin-bottom:10px;">Email Login</h3>
    <div class="btn-group">
        <input type="email" placeholder="Email Address">
        <input type="password" placeholder="Password">
        <button onclick="closeEmailModal(); startGame();">Login & Play</button>
        <button class="guest-btn" onclick="closeEmailModal()">Cancel</button>
    </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal">
    <h3 style="color:#e67e22; margin-bottom:10px;">Control Settings ⚙️</h3>
    <div class="btn-group">
        <label style="font-size:11px;">Control Type:</label>
        <select id="controlTypeSelect" onchange="changeControlType()">
            <option value="touch">Touch / Touchscreen</option>
            <option value="joystick">Joystick 360°</option>
            <option value="buttons">4-Direction Buttons</option>
        </select>
        <button onclick="closeSettings()">Save & Close</button>
    </div>
</div>

<!-- Shop Modal -->
<div id="shop-modal">
    <h3 style="color:#f39c12; margin-bottom:5px;">Skins & Flags Shop 🛒</h3>
    <div style="font-size:12px;">Balance: <span id="shopCoinVal" style="color:#f1c40f; font-weight:bold;">🪙 0</span></div>
    <div class="shop-list" id="shopItemsContainer"></div>
    <button onclick="closeShop()" style="width:120px;">Close</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    const MAP_SIZE = 16000; // Expanded Map Size
    let cameraScale = 0.65;
    let gameRunning = false;
    let score = 0, coins = 0;
    
    let totalMultiplier = 1;
    let activeMultipliers = [];
    let isMagnetActive = false;
    let isBoostActive = false;
    let boostCharge = false;
    let turnAgility = 0.12;
    let controlType = 'touch';

    let player = { x: MAP_SIZE/2, y: MAP_SIZE/2, angle: 0, targetAngle: 0, skin: 'kurdish', body: [], alive: true, thickness: 11 };
    let bots = [];
    let fruits = [];
    let coinItems = [];
    let powerups = [];
    let deadRemains = [];

    const garages = [
        { x: 500, y: 500 },
        { x: MAP_SIZE - 500, y: 500 },
        { x: 500, y: MAP_SIZE - 500 },
        { x: MAP_SIZE - 500, y: MAP_SIZE - 500 }
    ];

    const skinsDatabase = [
        { id: 'free1', name: '🟢 Lime Green', price: 0, color: '#2ecc71' },
        { id: 'free2', name: '🔵 Sky Blue', price: 0, color: '#3498db' },
        { id: 'free3', name: '🔴 Ruby Red', price: 0, color: '#e74c3c' },
        { id: 'free4', name: '🟡 Bright Yellow', price: 0, color: '#f1c40f' },
        { id: 'kurdish', name: '✌️ Kurdistan', price: 100, color: '#00A859' },
        { id: 'brazil', name: '🇧🇷 Brazil', price: 100, color: '#FFDF00' }
    ];

    let ownedSkins = skinsDatabase.filter(s => s.price === 0).map(s => s.id);

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function openShop() { document.getElementById('shop-modal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
    function openEmailModal() { document.getElementById('email-modal').style.display = 'flex'; }
    function closeEmailModal() { document.getElementById('email-modal').style.display = 'none'; }
    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function changeControlType() {
        controlType = document.getElementById('controlTypeSelect').value;
        document.getElementById('joystick-zone').style.display = controlType === 'joystick' ? 'block' : 'none';
        document.getElementById('btn-controls').style.display = controlType === 'buttons' ? 'grid' : 'none';
    }

    function setDir(x, y) {
        player.targetAngle = Math.atan2(y, x);
    }

    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true;
        initGame();
        gameLoop();
    }

    function initGame() {
        player.alive = true;
        player.x = MAP_SIZE/2; player.y = MAP_SIZE/2;
        player.body = [];
        player.thickness = 11;
        for(let i=0; i<30; i++) player.body.push({x: player.x - i*6, y: player.y});

        bots = [];
        for(let i=0; i<12; i++) spawnBot(i);

        fruits = [];
        const fTypes = ['🍌', '🍉', '🍒', '🍎', '🍓'];
        for(let i=0; i<4500; i++) {
            fruits.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, type: fTypes[Math.floor(Math.random()*fTypes.length)] });
        }

        coinItems = [];
        for(let i=0; i<250; i++) coinItems.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE });

        powerups = [];
        const pTypes = ['🧲', 'x2', 'x4', 'x6', 'x8', 'x10', '🚀', '☸️', '🎯'];
        for(let i=0; i<300; i++) {
            powerups.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, icon: pTypes[Math.floor(Math.random()*pTypes.length)] });
        }
    }

    function spawnBot(id) {
        let bx = Math.random() * (MAP_SIZE - 2000) + 1000;
        let by = Math.random() * (MAP_SIZE - 2000) + 1000;
        let body = [];
        for(let j=0; j<25; j++) body.push({x: bx - j*6, y: by});
        const botNames = ['Pro_Snake', 'Viper_X', 'Anaconda_CN', 'Shadow_99', 'Kurd_King', 'Hunter', 'Toxic_Bite', 'Speedy', 'Alpha_Bot', 'Slayer'];
        bots[id] = { id, name: botNames[id] || 'Bot_'+id, x: bx, y: by, angle: Math.random()*Math.PI*2, body, score: Math.floor(Math.random()*600+100), alive: true, circleAngle: 0 };
    }

    function explodeSnake(body) {
        body.forEach(p => deadRemains.push({ x: p.x, y: p.y, spawnTime: Date.now() }));
    }

    const boostBtn = document.getElementById('boost-btn');
    boostBtn.addEventListener('touchstart', () => boostCharge = true);
    boostBtn.addEventListener('touchend', () => boostCharge = false);
    boostBtn.addEventListener('mousedown', () => boostCharge = true);
    boostBtn.addEventListener('mouseup', () => boostCharge = false);

    function handlePointer(e) {
        if(!gameRunning || !player.alive || controlType !== 'touch') return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.targetAngle = Math.atan2(cy - canvas.height/2, cx - canvas.width/2);
    }
    window.addEventListener('touchmove', handlePointer);
    window.addEventListener('mousemove', handlePointer);

    function drawAnacondaHead(p, angle, mainColor, sizeRadius) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, sizeRadius * 1.5, sizeRadius * 1.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sizeRadius * 0.5, -sizeRadius * 0.4, sizeRadius * 0.25, 0, Math.PI * 2);
        ctx.arc(sizeRadius * 0.5, sizeRadius * 0.4, sizeRadius * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(sizeRadius * 0.6, -sizeRadius * 0.4, sizeRadius * 0.12, 0, Math.PI * 2);
        ctx.arc(sizeRadius * 0.6, sizeRadius * 0.4, sizeRadius * 0.12, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sizeRadius * 1.5, 0); ctx.lineTo(sizeRadius * 2.2, 0);
        ctx.lineTo(sizeRadius * 2.5, -3); ctx.moveTo(sizeRadius * 2.2, 0); ctx.lineTo(sizeRadius * 2.5, 3);
        ctx.stroke();

        ctx.restore();
    }

    function gameLoop() {
        if(!gameRunning) return;

        let now = Date.now();
        deadRemains = deadRemains.filter(r => now - r.spawnTime < 20000);

        if(player.alive) {
            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            player.angle += diff * turnAgility;

            let currentSpeed = (isBoostActive && boostCharge) ? 6.5 : 3.6;
            player.x += Math.cos(player.angle) * currentSpeed;
            player.y += Math.sin(player.angle) * currentSpeed;
            player.body.unshift({x: player.x, y: player.y});
            player.body.pop();

            // Slightly thicker with eating
            player.thickness = Math.min(18, 11 + Math.floor(player.body.length / 25));

            if(player.x <= 300 || player.x >= MAP_SIZE - 300 || player.y <= 300 || player.y >= MAP_SIZE - 300) {
                document.getElementById('danger-banner').style.display = 'block';
            } else {
                document.getElementById('danger-banner').style.display = 'none';
            }

            if(player.x <= 20 || player.x >= MAP_SIZE - 20 || player.y <= 20 || player.y >= MAP_SIZE - 20) {
                player.alive = false;
                alert("Game Over! You hit the Red Zone border!");
                location.reload();
            }

            // Eat Power-ups
            powerups.forEach((p, i) => {
                if(Math.hypot(player.x - p.x, player.y - p.y) < player.thickness + 12) {
                    if(p.icon === '🚀') {
                        isBoostActive = true;
                        document.getElementById('boost-btn').style.display = 'flex';
                        setTimeout(() => {
                            isBoostActive = false;
                            document.getElementById('boost-btn').style.display = 'none';
                        }, 15000);
                    }
                    powerups[i].x = Math.random() * MAP_SIZE;
                    powerups[i].y = Math.random() * MAP_SIZE;
                }
            });

            // Eat Fruits
            fruits.forEach((f, i) => {
                if(Math.hypot(player.x - f.x, player.y - f.y) < player.thickness + 10) {
                    score += 5;
                    document.getElementById('scoreVal').innerText = score;
                    fruits[i].x = Math.random() * MAP_SIZE;
                    fruits[i].y = Math.random() * MAP_SIZE;
                    player.body.push({...player.body[player.body.length-1]});
                }
            });
        }

        // BOTS
        bots.forEach(b => {
            if(!b.alive) return;
            b.x += Math.cos(b.angle) * 3.4;
            b.y += Math.sin(b.angle) * 3.4;
            b.body.unshift({x: b.x, y: b.y});
            b.body.pop();
        });

        // CAMERA
        const camX = canvas.width / 2 - player.x * cameraScale;
        const camY = canvas.height / 2 - player.y * cameraScale;

        ctx.fillStyle = '#0f131a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(camX, camY);
        ctx.scale(cameraScale, cameraScale);

        // GRID LINES
        ctx.strokeStyle = '#18202d'; ctx.lineWidth = 2;
        for(let x = 0; x < MAP_SIZE; x += 150) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
        }
        for(let y = 0; y < MAP_SIZE; y += 150) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
        }

        // RED ZONE BORDER
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 20;
        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

        fruits.forEach(f => { ctx.font = "24px Arial"; ctx.fillText(f.type, f.x, f.y); });
        powerups.forEach(p => { ctx.font = "bold 28px Arial"; ctx.fillText(p.icon, p.x, p.y); });

        if(player.alive) {
            player.body.forEach((p, i) => {
                if(i === 0) {
                    drawAnacondaHead(p, player.angle, '#00A859', player.thickness);
                } else {
                    ctx.fillStyle = i % 2 === 0 ? '#00A859' : '#ffffff';
                    ctx.beginPath(); ctx.arc(p.x, p.y, player.thickness, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        bots.forEach(b => {
            if(!b.alive) return;
            b.body.forEach((bp, j) => {
                if(j === 0) {
                    drawAnacondaHead(bp, b.angle, '#e74c3c', 10);
                } else {
                    ctx.fillStyle = j % 2 === 0 ? '#e74c3c' : '#f39c12';
                    ctx.beginPath(); ctx.arc(bp.x, bp.y, 9, 0, Math.PI*2); ctx.fill();
                }
            });
        });

        ctx.restore();

        radarCtx.clearRect(0, 0, 75, 75);
        if(player.alive) {
            radarCtx.fillStyle = '#2ecc71'; radarCtx.beginPath();
            radarCtx.arc((player.x/MAP_SIZE)*75, (player.y/MAP_SIZE)*75, 3.5, 0, Math.PI*2); radarCtx.fill();
        }

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
