<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shanshen.io</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="shop-modal" style="display:none; position:absolute; top:10px; left:10px; background:rgba(30,30,30,0.95); color:#fff; padding:20px; border-radius:12px; width:300px; max-width:90%; z-index:100;">
        <h3 style="margin-top:0; color:#f39c12;">🛒 Shop</h3>
        <div id="shop-tabs">
            <button onclick="renderShopUI('skins')">Skins</button>
            <button onclick="renderShopUI('flags')">Flags</button>
            <button onclick="renderShopUI('garage')">Garage</button>
        </div>
        <div id="shop-list" class="shop-list" style="min-height:80px; margin:15px 0;">Select a tab</div>
        
        <div style="border-top:1px solid #444; padding-top:15px;">
            <h4 style="margin:0 0 10px 0; color:#ddd;">🏆 Leaderboard</h4>
            <div id="leaderboard-list"></div>
        </div>
        
        <button onclick="closeShop()" style="margin-top:15px; background:#e74c3c; color:#fff; border:none; padding:10px; width:100%; cursor:pointer; border-radius:6px;">Close</button>
    </div>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="player.js"></script>
    <script src="bot.js"></script>
    <script src="items.js"></script>
    <script src="shop.js"></script>
    <script src="network.js"></script>
    <script src="ui-manager.js"></script>
    <script src="game-core.js"></script> <!-- ئەم فایلە دەبێت گۆڕابێت -->
</body>
</html>
