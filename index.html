<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100vw; height: 100vh;
            background-color: #0b0d12;
            color: #fff; font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        #radar-wrapper {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 4px 8px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 10px; margin-top: 4px; text-align: center; width: 70px;
        }

        #exit-btn {
            background: #e74c3c; color: #fff; font-weight: bold;
            border: none; padding: 4px 8px; border-radius: 6px;
            font-size: 10px; cursor: pointer; width: 70px; text-align: center; margin-top: 4px;
        }

        #red-zone-alert {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            color: #e74c3c; font-size: 18px; font-weight: bold;
            background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 8px;
            border: 2px solid #e74c3c; display: none; z-index: 8;
            animation: blinker 0.5s linear infinite;
        }

        #leaderboard-box {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.85); padding: 6px 10px;
            border-radius: 8px; border: 1.5px solid #f1c40f;
            font-size: 9px; z-index: 5; min-width: 120px; pointer-events: none;
        }

        #active-powers-container {
            position: absolute; top: 135px; left: 10px;
            display: flex; flex-direction: column; gap: 3px; z-index: 5;
        }
        .power-badge {
            background: rgba(241, 196, 15, 0.9); color: #111;
            padding: 2px 6px; border-radius: 8px; font-weight: bold;
            font-size: 9px; box-shadow: 0 0 6px #f1c40f; width: fit-content;
        }

        #ingame-garage-btn {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(243, 156, 18, 0.85); border: 1.5px solid #fff;
            color: #fff; padding: 6px 12px; border-radius: 12px;
            font-size: 11px; font-weight: bold; z-index: 10; cursor: pointer;
        }

        #boost-btn {
            position: absolute; bottom: 20px; right: 20px;
            width: 60px; height: 60px; background: rgba(231, 76, 60, 0.9);
            border: 2px solid #fff; border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 11px;
            z-index: 10; display: none; justify-content: center; align-items: center;
            box-shadow: 0 0 10px #e74c3c; cursor: pointer;
        }

        #menu-overlay, #shop-modal, #history-modal, #exit-modal {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 12, 16, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        #shop-modal, #history-modal, #exit-modal { display: none; z-index: 30; }

        h1 { font-size: 38px; color: #2ecc71; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 280px; }
        button { padding: 9px; font-size: 12px; border-radius: 12px; border: none; background: #2ecc71; color: #111; font-weight: bold; cursor: pointer; }
        button.shop-btn { background: #f39c12; color: #fff; }

        .shop-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 220px; overflow-y: auto; width: 85%; max-width: 320px; margin: 10px 0;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #181c24; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; font-size: 11px;
        }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="radar-wrapper">
    <canvas id="radar-canvas" width="70" height="70"></canvas>
    <div id="hud-stats">
        <div>Score: <span id="scoreVal" style="color:#2ecc71;">0</span></div>
        <div>Coins: <span id="coinVal" style="color:#f1c40f;">🪙 0</span></div>
    </div>
    <button id="exit-btn" onclick="openExitModal()">🏠 Exit</button>
</div>

<div id="red-zone-alert">⚠️ WARNING: RED ZONE! ⚠️</div>
<div id="active-powers-container"></div>

<div id="leaderboard-box">
    <h4 style="color:#f1c40f; text-align:center; margin-bottom:2px; font-size:9px;">🏆 TOP 10 PLAYERS</h4>
    <div id="topList"></div>
</div>

<div id="ingame-garage-btn" onclick="openShop()">🚗 Garage</div>
<div id="boost-btn">BOOST 🚀</div>

<!-- Main Menu -->
<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:30px; margin-bottom:8px;">🐍</div>
    <div style="font-size:12px; color:#f1c40f; margin-bottom:10px;">
        High Score: <span id="menuHighScore">0</span> | Coins: <span id="menuCoins">0</span> 🪙
    </div>
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name" style="padding:9px; border-radius:12px; border:1px solid #2ecc71; background:#181c24; color:#fff; text-align:center;">
        <button onclick="startGame()">Play Game 🎮</button>
        <button class="shop-btn" onclick="openShop()">Shop & Country Flags 🛒</button>
    </div>
</div>

<!-- Exit Confirm Modal -->
<div id="exit-modal">
    <h3 style="color:#e74c3c; margin-bottom:15px;">Exit Game?</h3>
    <div class="btn-group">
        <button onclick="confirmExit()" style="background:#e74c3c; color:#fff;">Go to Main Menu 🏠</button>
        <button onclick="closeExitModal()" style="background:#2ecc71; color:#111;">Continue Playing ▶️</button>
    </div>
</div>

<!-- Shop Modal -->
<div id="shop-modal">
    <h3 style="color:#f39c12; margin-bottom:5px;">Skins & Country Flags 🛒</h3>
    <div style="font-size:12px;">Saved Coins: <span id="shopCoinVal" style="color:#f1c40f; font-weight:bold;">🪙 0</span></div>
    <div class="shop-list" id="shopItemsContainer"></div>
    <button onclick="closeShop()" style="width:120px;">Close</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    const MAP_RADIUS = 6000;
    const MAP_CENTER = 7000;
    let cameraScale = 0.65;
    let gameRunning = false;
    let lastTime = performance.now();

    let coins = parseInt(localStorage.getItem('dodio_coins') || '0');
    let highScore = parseInt(localStorage.getItem('dodio_highscore') || '0');
    let score = 0;

    let currentMultiplier = 1;
    let manualSpeedBoost = false;
    let isMagnetActive = false;
    let isSteeringActive = false;
    let activePowers = [];
    let deadRemains = [];

    let player = { x: MAP_CENTER, y: MAP_CENTER, angle: 0, targetAngle: 0, skin: 'kurdish', body: [], alive: true, sizeRadius: 18 };
    let bots = [];
    let fruits = [];
    let coinItems = [];
    let powerups = [];

    // Full Flag Skins Database with Colors for Body Pattern
    const skinsDatabase = [
        { id: 'free1', name: '🟢 Lime Green', price: 0, colors: ['#2ecc71', '#27ae60'] },
        { id: 'free2', name: '🔵 Sky Blue', price: 0, colors: ['#3498db', '#2980b9'] },
        { id: 'kurdish', name: '✌️ Kurdistan Flag', price: 100, colors: ['#e74c3c', '#ffffff', '#2ecc71', '#f1c40f'] },
        { id: 'brazil', name: '🇧🇷 Brazil Flag', price: 100, colors: ['#009c3b', '#ffdf00', '#002776'] },
        { id: 'argentina', name: '🇦🇷 Argentina Flag', price: 100, colors: ['#74acdf', '#ffffff', '#74acdf'] },
        { id: 'germany', name: '🇩🇪 Germany Flag', price: 100, colors: ['#000000', '#dd0000', '#ffce00'] },
        { id: 'france', name: '🇫🇷 France Flag', price: 100, colors: ['#002395', '#ffffff', '#ed2939'] },
        { id: 'spain', name: '🇪🇸 Spain Flag', price: 100, colors: ['#aa152b', '#f1bf00', '#aa152b'] }
    ];

    let ownedSkins = skinsDatabase.map(s => s.id);

    const garages = [
        { x: MAP_CENTER - 3500, y: MAP_CENTER - 3500 },
        { x: MAP_CENTER + 3500, y: MAP_CENTER - 3500 },
        { x: MAP_CENTER - 3500, y: MAP_CENTER + 3500 },
        { x: MAP_CENTER + 3500, y: MAP_CENTER + 3500 }
    ];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    updateMenuStats();

    function updateMenuStats() {
        document.getElementById('coinVal').innerText = `🪙 ${coins}`;
        document.getElementById('menuCoins').innerText = coins;
        document.getElementById('menuHighScore').innerText = highScore;
    }

    function openShop() { renderShop(); document.getElementById('shop-modal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
    function openExitModal() { document.getElementById('exit-modal').style.display = 'flex'; }
    function closeExitModal() { document.getElementById('exit-modal').style.display = 'none'; }
    function confirmExit() { gameRunning = false; closeExitModal(); document.getElementById('menu-overlay').style.display = 'flex'; }

    function renderShop() {
        let container = document.getElementById('shopItemsContainer');
        container.innerHTML = "";
        skinsDatabase.forEach(s => {
            let isOwned = ownedSkins.includes(s.id);
            let isSelected = player.skin === s.id;
            container.innerHTML += `
                <div class="shop-item">
                    <span>${s.name}</span>
                    <button style="background:${isSelected ? '#27ae60' : '#2980b9'}; padding:4px 8px;" onclick="selectSkin('${s.id}')">${isSelected ? 'Equipped' : 'Equip'}</button>
                </div>
            `;
        });
    }

    function selectSkin(id) { player.skin = id; renderShop(); }

    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true; initGame();
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function saveStats() {
        localStorage.setItem('dodio_coins', coins.toString());
        if(score > highScore) { highScore = score; localStorage.setItem('dodio_highscore', highScore.toString()); }
        updateMenuStats();
    }

    function initGame() {
        score = 0; currentMultiplier = 1;
        document.getElementById('scoreVal').innerText = score;
        
        player.alive = true; player.x = MAP_CENTER; player.y = MAP_CENTER;
        player.sizeRadius = 18; player.body = [];
        for(let i=0; i<30; i++) player.body.push({x: player.x - i*6, y: player.y});

        bots = [];
        for(let i=0; i<10; i++) spawnBot(i);

        fruits = [];
        const fTypes = ['🍌', '🍉', '🍒', '🍎', '🍓'];
        for(let i=0; i<2500; i++) {
            let angle = Math.random() * Math.PI * 2;
            let r = Math.random() * (MAP_RADIUS - 100);
            fruits.push({ x: MAP_CENTER + Math.cos(angle)*r, y: MAP_CENTER + Math.sin(angle)*r, type: fTypes[Math.floor(Math.random()*fTypes.length)] });
        }

        coinItems = [];
        for(let i=0; i<180; i++) {
            let angle = Math.random() * Math.PI * 2;
            let r = Math.random() * (MAP_RADIUS - 100);
            coinItems.push({ x: MAP_CENTER + Math.cos(angle)*r, y: MAP_CENTER + Math.sin(angle)*r });
        }

        powerups = [];
        const pTypes = ['🧲', 'x2', 'x4', 'x6', 'x10', '🚀', '🎯', '🎛️']; // 🎯 Sniper Scope, 🎛️ Airplane Steering
        for(let i=0; i<200; i++) {
            let angle = Math.random() * Math.PI * 2;
            let r = Math.random() * (MAP_RADIUS - 100);
            powerups.push({ x: MAP_CENTER + Math.cos(angle)*r, y: MAP_CENTER + Math.sin(angle)*r, icon: pTypes[Math.floor(Math.random()*pTypes.length)] });
        }
    }

    function spawnBot(id) {
        let angle = Math.random() * Math.PI * 2;
        let r = Math.random() * (MAP_RADIUS - 1000);
        let bx = MAP_CENTER + Math.cos(angle)*r;
        let by = MAP_CENTER + Math.sin(angle)*r;
        let body = [];
        for(let j=0; j<50; j++) body.push({x: bx - j*8, y: by});
        const botNames = ['Apex_Viper', 'Shadow_Hunter', 'Anaconda_King', 'Kurd_Pro', 'Slayer_99', 'Toxic_Bite', 'Alpha_Dragon', 'Speed_Master', 'Mega_Snake', 'Venom_X'];
        bots[id] = { id, name: botNames[id], x: bx, y: by, angle: Math.random()*Math.PI*2, body, score: 1500, alive: true, sizeRadius: 22 };
    }

    function explodeSnake(body) {
        const colors = ['#2ecc71', '#f1c40f', '#e74c3c', '#3498db', '#9b59b6'];
        body.forEach(p => deadRemains.push({ x: p.x, y: p.y, color: colors[Math.floor(Math.random() * colors.length)], spawnTime: Date.now() }));
    }

    const boostBtn = document.getElementById('boost-btn');
    boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); manualSpeedBoost = true; });
    boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); manualSpeedBoost = false; });

    window.addEventListener('touchmove', (e) => {
        if(!gameRunning || !player.alive) return;
        const touch = e.touches[0];
        player.targetAngle = Math.atan2(touch.clientY - canvas.height/2, touch.clientX - canvas.width/2);
    });

    function addPowerupTimer(name, icon, durationMs, onExpire) {
        let expireTime = Date.now() + durationMs;
        let powerObj = { name, icon, expireTime };
        activePowers.push(powerObj);
        setTimeout(() => {
            let idx = activePowers.indexOf(powerObj);
            if(idx > -1) activePowers.splice(idx, 1);
            if(onExpire) onExpire();
        }, durationMs);
    }

    function renderPowerBadges() {
        let container = document.getElementById('active-powers-container');
        let html = ""; let now = Date.now();
        activePowers.forEach(p => {
            let timeLeft = Math.max(0, Math.ceil((p.expireTime - now) / 1000));
            html += `<div class="power-badge">${p.icon} ${p.name} (${timeLeft}s)</div>`;
        });
        container.innerHTML = html;
    }

    function drawSnakeHead(p, angle, mainColor, radius) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(angle);
        ctx.fillStyle = mainColor; ctx.beginPath();
        ctx.ellipse(0, 0, radius * 1.7, radius * 1.25, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();

        ctx.fillStyle = '#f1c40f'; ctx.beginPath();
        ctx.ellipse(radius*0.5, -radius*0.4, radius*0.35, radius*0.2, Math.PI*0.1, 0, Math.PI * 2);
        ctx.ellipse(radius*0.5, radius*0.4, radius*0.35, radius*0.2, -Math.PI*0.1, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#000'; ctx.beginPath();
        ctx.arc(radius*0.55, -radius*0.4, radius*0.12, 0, Math.PI * 2);
        ctx.arc(radius*0.55, radius*0.4, radius*0.12, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function updateLeaderboard() {
        let list = [{ name: document.getElementById('playerName').value || "You (Player)", score: score }];
        bots.forEach(b => { if(b.alive) list.push({ name: b.name, score: b.score }); });
        list.sort((a, b) => b.score - a.score);

        let html = "";
        list.slice(0, 10).forEach((item, idx) => {
            let isPlayer = item.name.includes("Player");
            html += `<div style="color:${isPlayer ? '#2ecc71' : '#fff'};">${idx+1}. ${item.name} - ${item.score}</div>`;
        });
        document.getElementById('topList').innerHTML = html;
    }

    function gameLoop(now) {
        if(!gameRunning) return;
        let dt = (now - lastTime) / 1000;
        if(dt > 0.1) dt = 0.1;
        lastTime = now;

        deadRemains = deadRemains.filter(r => Date.now() - r.spawnTime < 20000);

        if(player.alive) {
            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;

            player.angle += diff * (isSteeringActive ? 0.45 : 0.22);

            let currentSpeed = (manualSpeedBoost ? 380 : 220) * (dt * 60 / 1);
            player.x += Math.cos(player.angle) * (currentSpeed * 0.08);
            player.y += Math.sin(player.angle) * (currentSpeed * 0.08);
            player.body.unshift({x: player.x, y: player.y});

            // Growth in Length & Thickness
            let maxAllowedSegments = Math.min(90, 30 + Math.floor(score / 100));
            while(player.body.length > maxAllowedSegments) player.body.pop();

            // Circular Zone Death Check
            let distFromCenter = Math.hypot(player.x - MAP_CENTER, player.y - MAP_CENTER);
            if(distFromCenter >= MAP_RADIUS - 50) {
                player.alive = false; alert("Game Over! You hit the Circular Red Zone!"); location.reload();
            }
            document.getElementById('red-zone-alert').style.display = distFromCenter > MAP_RADIUS - 800 ? 'block' : 'none';

            bots.forEach(b => {
                if(!b.alive) return;
                b.body.forEach((seg, idx) => {
                    if(idx > 2 && Math.hypot(player.x - seg.x, player.y - seg.y) < player.sizeRadius + b.sizeRadius*0.5) {
                        player.alive = false; alert("Game Over! You crashed into a bot!"); location.reload();
                    }
                });
            });

            // Eat Fruits
            fruits.forEach((f, i) => {
                if(Math.hypot(player.x - f.x, player.y - f.y) < player.sizeRadius + 22) {
                    score += 5 * currentMultiplier;
                    document.getElementById('scoreVal').innerText = score;
                    f.x = MAP_CENTER + (Math.random()-0.5)*MAP_RADIUS*1.8;
                    f.y = MAP_CENTER + (Math.random()-0.5)*MAP_RADIUS*1.8;
                    if(player.sizeRadius < 35) player.sizeRadius += 0.05; // Thickness Growth!
                }
            });

            // Eat Powerups
            powerups.forEach((p, i) => {
                if(Math.hypot(player.x - p.x, player.y - p.y) < player.sizeRadius + 25) {
                    if(p.icon.includes('x')) {
                        let val = parseInt(p.icon.replace('x', '')) || 2;
                        currentMultiplier = val;
                        addPowerupTimer(`Multiplier ${p.icon}`, p.icon, 15000, () => currentMultiplier = 1);
                    }
                    if(p.icon === '🎯') { // Sniper Camera Zoom
                        cameraScale = 0.38;
                        addPowerupTimer('Sniper Zoom', '🎯', 15000, () => cameraScale = 0.65);
                    }
                    if(p.icon === '🚀') {
                        document.getElementById('boost-btn').style.display = 'flex';
                        addPowerupTimer('Boost Button', '🚀', 15000, () => {
                            document.getElementById('boost-btn').style.display = 'none'; manualSpeedBoost = false;
                        });
                    }
                    if(p.icon === '🎛️') {
                        isSteeringActive = true; addPowerupTimer('Airplane Steering', '🎛️', 15000, () => isSteeringActive = false);
                    }

                    p.x = MAP_CENTER + (Math.random()-0.5)*MAP_RADIUS*1.8;
                    p.y = MAP_CENTER + (Math.random()-0.5)*MAP_RADIUS*1.8;
                }
            });
        }

        // Smart Bots Logic
        bots.forEach(b => {
            if(!b.alive) return;
            let distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);
            if(distToPlayer < 1000 && player.alive) {
                b.angle = Math.atan2(player.y - b.y, player.x - b.x);
            } else { b.angle += (Math.random() - 0.5) * 0.1; }

            b.x += Math.cos(b.angle) * 4.2; b.y += Math.sin(b.angle) * 4.2;
            b.body.unshift({x: b.x, y: b.y}); b.body.pop();

            player.body.forEach((pSeg, idx) => {
                if(idx > 2 && Math.hypot(b.x - pSeg.x, b.y - pSeg.y) < b.sizeRadius) {
                    b.alive = false; explodeSnake(b.body); setTimeout(() => spawnBot(b.id), 500);
                }
            });
        });

        const camX = canvas.width / 2 - player.x * cameraScale;
        const camY = canvas.height / 2 - player.y * cameraScale;

        ctx.fillStyle = '#0f131a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save(); ctx.translate(camX, camY); ctx.scale(cameraScale, cameraScale);

        // CIRCULAR MAP BORDER
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 25; ctx.beginPath();
        ctx.arc(MAP_CENTER, MAP_CENTER, MAP_RADIUS, 0, Math.PI * 2); ctx.stroke();

        // Garages
        garages.forEach(g => {
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(g.x - 100, g.y - 100, 200, 200);
            ctx.fillStyle = '#fff'; ctx.font = "bold 20px Arial"; ctx.fillText("GARAGE 🚗", g.x - 50, g.y + 5);
        });

        fruits.forEach(f => { ctx.font = "24px Arial"; ctx.fillText(f.type, f.x, f.y); });
        deadRemains.forEach(r => { ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(r.x, r.y, 12, 0, Math.PI*2); ctx.fill(); });
        powerups.forEach(p => { ctx.font = "bold 28px Arial"; ctx.fillText(p.icon, p.x, p.y); });

        // Draw Player Snake with Full Country Flag Colors
        if(player.alive) {
            let skinObj = skinsDatabase.find(s => s.id === player.skin) || skinsDatabase[0];
            player.body.forEach((p, i) => {
                let color = skinObj.colors[i % skinObj.colors.length];
                if(i === 0) drawSnakeHead(p, player.angle, color, player.sizeRadius);
                else {
                    ctx.fillStyle = color; ctx.beginPath();
                    ctx.arc(p.x, p.y, player.sizeRadius * 0.85, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        // Draw Bots
        bots.forEach(b => {
            if(!b.alive) return;
            b.body.forEach((bp, j) => {
                if(j === 0) drawSnakeHead(bp, b.angle, '#e74c3c', b.sizeRadius);
                else {
                    ctx.fillStyle = j % 2 === 0 ? '#e74c3c' : '#3498db';
                    ctx.beginPath(); ctx.arc(bp.x, bp.y, b.sizeRadius * 0.8, 0, Math.PI*2); ctx.fill();
                }
            });
        });

        ctx.restore();

        // Radar
        radarCtx.clearRect(0, 0, 70, 70);
        if(player.alive) {
            radarCtx.fillStyle = '#2ecc71'; radarCtx.beginPath();
            radarCtx.arc(((player.x - (MAP_CENTER - MAP_RADIUS))/(MAP_RADIUS*2))*70, ((player.y - (MAP_CENTER - MAP_RADIUS))/(MAP_RADIUS*2))*70, 3.5, 0, Math.PI*2); radarCtx.fill();
        }

        renderPowerBadges(); updateLeaderboard();
        requestAnimationFrame(gameLoop);
    }
</script>
