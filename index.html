<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #gameCanvas {
            background: #181818;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #2ecc71;
            font-size: 13px;
        }
        .leaderboard {
            border-color: #f1c40f;
            min-width: 130px;
        }
        .leaderboard h4 { color: #f1c40f; text-align: center; margin-bottom: 4px; }

        /* Radar & Trophy Area */
        #radar-container {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 100px;
            height: 100px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #2ecc71;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #trophy-tag {
            position: absolute;
            bottom: 120px;
            right: 15px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #f1c40f;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 11px;
            color: #f1c40f;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
        }

        /* Main Menu Overlay */
        #menu-overlay, #settings-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #settings-modal { display: none; z-index: 30; }

        h1 { font-size: 42px; color: #2ecc71; margin-bottom: 15px; letter-spacing: 2px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; width: 80%; max-width: 260px; }
        
        button, select, input {
            padding: 12px;
            font-size: 15px;
            border-radius: 20px;
            border: 2px solid #2ecc71;
            background: #222;
            color: #fff;
            text-align: center;
            outline: none;
        }
        button {
            background: #2ecc71;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button.fb-btn { background: #1877f2; color: #fff; }
        button.guest-btn { background: #333; color: #fff; border: 1px solid #555; }
        button.settings-btn { background: #e67e22; color: #fff; }

        /* Controls */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(46, 204, 113, 0.5);
            border-radius: 50%;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: #2ecc71;
            border-radius: 50%;
        }
        #btn-controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: none;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(3, 45px);
            gap: 5px;
            z-index: 10;
        }
        .ctrl-btn {
            background: rgba(46, 204, 113, 0.6);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="hud">
    <div class="hud-box">
        <div>Score: <span id="scoreVal">0</span></div>
        <div>Players: <span id="playersVal">1</span></div>
    </div>
    <div class="hud-box leaderboard">
        <h4>🏆 Leaderboard</h4>
        <div id="topList">
            1. 🥇 Player1 - 1500<br>
            2. 🥈 Player2 - 920<br>
            3. 🥉 Player3 - 710
        </div>
    </div>
</div>

<div id="trophy-tag">
    <span>🏆 24h Champ:</span> <strong id="champName">No One</strong>
</div>
<div id="radar-container"></div>

<!-- Touch Controls -->
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<div id="btn-controls">
    <div></div><button class="ctrl-btn" id="btn-up">▲</button><div></div>
    <button class="ctrl-btn" id="btn-left">◀</button><div></div><button class="ctrl-btn" id="btn-right">▶</button>
    <div></div><button class="ctrl-btn" id="btn-down">▼</button><div></div>
</div>

<!-- Main Menu -->
<div id="menu-overlay">
    <h1>dod.io</h1>
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name">
        
        <select id="skinSelect">
            <optgroup label="Regions & Nations ☀️">
                <option value="kurdish">✌️ Kurdistan</option>
                <option value="catalonia">🟡🔴 Catalonia</option>
                <option value="scotland">🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland</option>
            </optgroup>
            <optgroup label="World Countries 🌍">
                <option value="brazil">🇧🇷 Brazil</option>
                <option value="argentina">🇦🇷 Argentina</option>
                <option value="germany">🇩🇪 Germany</option>
                <option value="france">🇫🇷 France</option>
                <option value="spain">🇪🇸 Spain</option>
                <option value="italy">🇮🇹 Italy</option>
            </optgroup>
        </select>

        <button onclick="startGame()">Play as Guest 🎮</button>
        <button class="guest-btn" onclick="startGame()">Email Login ✉️</button>
        <button class="fb-btn" onclick="startGame()">Connect Facebook 📘</button>
        <button class="settings-btn" onclick="openSettings()">Settings ⚙️</button>
    </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal">
    <h2 style="color:#2ecc71; margin-bottom:20px;">Control Settings</h2>
    <div class="btn-group">
        <label>Control Type:</label>
        <select id="controlType" onchange="updateControlType()">
            <option value="joystick">Joystick 360°</option>
            <option value="dpad">4-Direction Buttons</option>
        </select>

        <label>Joystick Size:</label>
        <input type="range" id="joySize" min="80" max="180" value="120" oninput="resizeJoystick()">

        <button onclick="closeSettings()">Save & Close</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameRunning = false;
    let score = 0;
    let currentSkin = 'kurdish';
    let snake = [];
    let food = {x: 200, y: 200};
    let dir = {x: 3, y: 0};

    function startGame() {
        currentSkin = document.getElementById('skinSelect').value;
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true;
        initSnake();
        gameLoop();
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function updateControlType() {
        const type = document.getElementById('controlType').value;
        if(type === 'joystick') {
            document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('btn-controls').style.display = 'none';
        } else {
            document.getElementById('joystick-zone').style.display = 'none';
            document.getElementById('btn-controls').style.display = 'grid';
        }
    }

    function resizeJoystick() {
        const size = document.getElementById('joySize').value;
        const zone = document.getElementById('joystick-zone');
        zone.style.width = size + 'px';
        zone.style.height = size + 'px';
    }

    function initSnake() {
        snake = [];
        for(let i=0; i<18; i++) {
            snake.push({x: canvas.width/2 - i*7, y: canvas.height/2});
        }
    }

    function getSkinColors(skin) {
        switch(skin) {
            case 'kurdish': return ['#EE2324', '#FFFFFF', '#00A859', '#FE8200'];
            case 'catalonia': return ['#F1BF00', '#AA152B'];
            case 'scotland': return ['#0065BD', '#FFFFFF'];
            case 'brazil': return ['#009C3B', '#FFDF00', '#002776'];
            case 'argentina': return ['#74ACDF', '#FFFFFF'];
            case 'germany': return ['#000000', '#DD0000', '#FFCE00'];
            case 'france': return ['#002395', '#FFFFFF', '#ED2939'];
            case 'spain': return ['#AA152B', '#F1BF00'];
            case 'italy': return ['#009246', '#FFFFFF', '#CE2B37'];
            default: return ['#2ecc71'];
        }
    }

    function gameLoop() {
        if(!gameRunning) return;

        ctx.fillStyle = '#141414';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Snake Movement
        let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
        snake.unshift(head);
        snake.pop();

        // Draw Food
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(food.x, food.y, 8, 0, Math.PI * 2);
        ctx.fill();

        // Draw Snake Body
        const colors = getSkinColors(currentSkin);
        snake.forEach((part, i) => {
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.arc(part.x, part.y, i === 0 ? 11 : 9, 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
