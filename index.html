<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100vw; height: 100vh;
            background-color: #0b0d12;
            color: #fff; font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        /* HUD Top Left */
        #radar-wrapper {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 75px; height: 75px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 3px 6px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 9px; margin-top: 2px; text-align: center; width: 75px;
        }

        /* Left Bottom Stack: Garage & Exit */
        #left-bottom-container {
            position: absolute; bottom: 15px; left: 15px;
            display: flex; flex-direction: column; gap: 6px; z-index: 10;
        }
        #ingame-garage-btn {
            background: rgba(243, 156, 18, 0.9); border: 1.5px solid #fff;
            color: #fff; padding: 5px 10px; border-radius: 10px;
            font-size: 10px; font-weight: bold; cursor: pointer; text-align: center; width: 75px;
        }
        #exit-btn {
            background: #e74c3c; color: #fff; font-weight: bold;
            border: 1.5px solid #fff; padding: 5px 10px; border-radius: 10px;
            font-size: 10px; cursor: pointer; text-align: center; width: 75px;
        }

        /* Dynamic Floating Joystick */
        #joystick-zone {
            position: absolute; width: 80px; height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(46, 204, 113, 0.8);
            border-radius: 50%; z-index: 10; display: none;
            pointer-events: none; transform: translate(-50%, -50%);
        }
        #joystick-knob {
            position: absolute; top: 20px; left: 20px;
            width: 40px; height: 40px;
            background: #2ecc71; border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71; pointer-events: none;
        }

        /* 4-Direction Buttons */
        #btn-controls {
            position: absolute; bottom: 20px; right: 20px;
            display: none; grid-template-columns: repeat(3, 38px);
            grid-template-rows: repeat(3, 38px); gap: 4px; z-index: 10;
        }
        .ctrl-btn {
            background: rgba(46, 204, 113, 0.75); border: 1px solid #fff;
            color: #fff; font-weight: bold; border-radius: 8px; font-size: 14px;
        }

        #red-zone-alert {
            position: absolute; top: 18%; left: 50%; transform: translate(-50%, -50%);
            color: #e74c3c; font-size: 14px; font-weight: bold;
            background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 8px;
            border: 2px solid #e74c3c; display: none; z-index: 8;
            animation: blinker 0.5s linear infinite;
        }

        #leaderboard-box {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.85); padding: 6px 10px;
            border-radius: 8px; border: 1.5px solid #f1c40f;
            font-size: 9px; z-index: 5; min-width: 120px; pointer-events: none;
        }

        /* Compact Smaller Active Power Badges */
        #active-powers-container {
            position: absolute; top: 125px; left: 10px;
            display: flex; flex-direction: column; gap: 3px; z-index: 5;
        }
        .power-badge {
            background: rgba(241, 196, 15, 0.95); color: #111;
            padding: 2px 6px; border-radius: 6px; font-weight: bold;
            font-size: 9px; box-shadow: 0 0 4px #f1c40f; width: fit-content;
        }

        #boost-btn {
            position: absolute; bottom: 20px; right: 20px;
            width: 55px; height: 55px; background: rgba(231, 76, 60, 0.9);
            border: 2px solid #fff; border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 10px;
            z-index: 10; display: none; justify-content: center; align-items: center;
            box-shadow: 0 0 8px #e74c3c; cursor: pointer;
        }

        /* Modals & Overlays */
        #menu-overlay, #shop-modal, #exit-modal, #settings-modal {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 12, 16, 0.96); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        #shop-modal, #exit-modal, #settings-modal { display: none; z-index: 30; }

        h1 { font-size: 36px; color: #2ecc71; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 280px; }
        button, input, select { padding: 9px; font-size: 11px; border-radius: 10px; border: none; outline: none; }
        button { background: #2ecc71; color: #111; font-weight: bold; cursor: pointer; }
        button.fb-btn { background: #1877f2; color: #fff; }
        button.guest-btn { background: #282c34; color: #fff; border: 1px solid #444; }
        button.shop-btn { background: #f39c12; color: #fff; }

        .shop-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 60vh; overflow-y: auto; width: 92%; max-width: 340px; margin: 10px 0;
            padding: 5px; -webkit-overflow-scrolling: touch;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #181c24; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; font-size: 11px;
        }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="radar-wrapper">
    <canvas id="radar-canvas" width="75" height="75"></canvas>
    <div id="hud-stats">
        <div>Score: <span id="scoreVal" style="color:#2ecc71;">0</span></div>
        <div>Coins: <span id="coinVal" style="color:#f1c40f;">🪙 0</span></div>
    </div>
</div>

<div id="left-bottom-container">
    <div id="ingame-garage-btn" onclick="openShop()">🚗 Garage</div>
    <div id="exit-btn" onclick="openExitModal()">🏠 Exit</div>
</div>

<div id="joystick-zone"><div id="joystick-knob"></div></div>
<div id="btn-controls">
    <div></div><button class="ctrl-btn" onclick="setDir(0, -1)">▲</button><div></div>
    <button class="ctrl-btn" onclick="setDir(-1, 0)">◀</button><div></div><button class="ctrl-btn" onclick="setDir(1, 0)">▶</button>
    <div></div><button class="ctrl-btn" onclick="setDir(0, 1)">▼</button><div></div>
</div>

<div id="red-zone-alert">⚠️ WARNING: RED ZONE! ⚠️</div>
<div id="active-powers-container"></div>

<div id="leaderboard-box">
    <h4 style="color:#f1c40f; text-align:center; margin-bottom:4px; font-size:9px;">🏆 TOP 10 PLAYERS</h4>
    <div id="topList"></div>
</div>

<div id="boost-btn">BOOST 🚀</div>

<!-- Main Menu -->
<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:32px; margin-bottom:8px;">🐍</div>
    <div style="font-size:11px; color:#f1c40f; margin-bottom:12px;">
        High Score: <span id="menuHighScore">0</span> | Coins: <span id="menuCoins">0</span> 🪙
    </div>
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name" style="border:1px solid #2ecc71; background:#181c24; color:#fff; text-align:center;">
        <button onclick="startGame()">Play Game 🎮</button>
        <button class="shop-btn" onclick="openShop()">Shop & Country Flags 🛒</button>
        <button style="background:#e67e22; color:#fff;" onclick="openSettings()">Controls & Settings ⚙️</button>
        <button class="fb-btn" onclick="loginFacebook()">Login with Facebook 📘</button>
        <button class="guest-btn" onclick="loginGuest()">Play as Guest / Email 👤</button>
    </div>
</div>

<!-- Controls Settings Modal -->
<div id="settings-modal">
    <h3 style="color:#e67e22; margin-bottom:10px;">Control Settings ⚙️</h3>
    <div class="btn-group">
        <label style="font-size:11px;">Control Style:</label>
        <select id="controlTypeSelect" onchange="changeControlType()" style="border:1px solid #e67e22; background:#181c24; color:#fff;">
            <option value="touch">Touch Pointer Target</option>
            <option value="joystick">Floating Anywhere Joystick</option>
            <option value="buttons">4-Direction Buttons</option>
        </select>
        <button onclick="closeSettings()">Save & Back</button>
    </div>
</div>

<!-- Exit Confirm Modal -->
<div id="exit-modal">
    <h3 style="color:#e74c3c; margin-bottom:15px;">Exit Game?</h3>
    <div class="btn-group">
        <button onclick="confirmExit()" style="background:#e74c3c; color:#fff;">Main Menu 🏠</button>
        <button onclick="closeExitModal()" style="background:#2ecc71; color:#111;">Continue Playing ▶️</button>
    </div>
</div>

<!-- Full Shop Modal with Free & Country Flag Skins -->
<div id="shop-modal">
    <h3 style="color:#f39c12; margin-bottom:5px;">Skins & Country Flags 🛒</h3>
    <div style="font-size:11px; margin-bottom:5px;">Saved Coins: <span id="shopCoinVal" style="color:#f1c40f; font-weight:bold;">🪙 0</span></div>
    <div class="shop-list" id="shopItemsContainer"></div>
    <button onclick="closeShop()" style="width:120px; margin-top:5px;">Close</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    const MAP_RADIUS = 18000;
    const MAP_CENTER = 20000;
    let cameraScale = 0.50;
    let gameRunning = false;
    let controlType = 'touch';
    let lastFrameTime = performance.now();

    let coins = parseInt(localStorage.getItem('dodio_coins') || '0');
    let highScore = parseInt(localStorage.getItem('dodio_highscore') || '0');
    let score = 0;

    let currentMultiplier = 1;
    let manualSpeedBoost = false;
    let isMagnetActive = false;
    let isSteeringActive = false;
    let activePowers = [];
    let deadRemains = [];

    let player = { x: MAP_CENTER, y: MAP_CENTER, angle: 0, targetAngle: 0, skin: 'kurdish', body: [], alive: true, sizeRadius: 20 };
    let bots = [];
    let fruits = [];
    let coinItems = [];
    let powerups = [];

    const skinsDatabase = [
        { id: 'free1', name: '🟢 Lime Green', colors: ['#2ecc71', '#27ae60'] },
        { id: 'free2', name: '🔵 Sky Blue', colors: ['#3498db', '#2980b9'] },
        { id: 'free3', name: '🔴 Ruby Red', colors: ['#e74c3c', '#c0392b'] },
        { id: 'free4', name: '🟡 Bright Yellow', colors: ['#f1c40f', '#f39c12'] },
        { id: 'free5', name: '🟣 Royal Purple', colors: ['#9b59b6', '#8e44ad'] },
        { id: 'kurdish', name: '✌️ Kurdistan Flag', colors: ['#e74c3c', '#ffffff', '#2ecc71', '#f1c40f'] },
        { id: 'brazil', name: '🇧🇷 Brazil Flag', colors: ['#009c3b', '#ffdf00', '#002776'] },
        { id: 'argentina', name: '🇦🇷 Argentina Flag', colors: ['#74acdf', '#ffffff', '#74acdf'] },
        { id: 'germany', name: '🇩🇪 Germany Flag', colors: ['#000000', '#dd0000', '#ffce00'] },
        { id: 'france', name: '🇫🇷 France Flag', colors: ['#002395', '#ffffff', '#ed2939'] },
        { id: 'spain', name: '🇪🇸 Spain Flag', colors: ['#aa152b', '#f1bf00', '#aa152b'] },
        { id: 'italy', name: '🇮🇹 Italy Flag', colors: ['#009246', '#ffffff', '#ce2b37'] },
        { id: 'england', name: '🏴󠁧󠁢󠁥󠁮󠁧󠁿 England Flag', colors: ['#ffffff', '#ce1124', '#ffffff'] },
        { id: 'portugal', name: '🇵🇹 Portugal Flag', colors: ['#046a38', '#da291c'] }
    ];

    const garages = [
        { x: MAP_CENTER - 11000, y: MAP_CENTER - 11000 },
        { x: MAP_CENTER + 11000, y: MAP_CENTER - 11000 },
        { x: MAP_CENTER - 11000, y: MAP_CENTER + 11000 },
        { x: MAP_CENTER + 11000, y: MAP_CENTER + 11000 }
    ];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    updateMenuStats();

    function updateMenuStats() {
        document.getElementById('coinVal').innerText = `🪙 ${coins}`;
        document.getElementById('menuCoins').innerText = coins;
        document.getElementById('menuHighScore').innerText = highScore;
    }

    function openShop() { renderShop(); document.getElementById('shop-modal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
    function openExitModal() { document.getElementById('exit-modal').style.display = 'flex'; }
    function closeExitModal() { document.getElementById('exit-modal').style.display = 'none'; }
    function confirmExit() { gameRunning = false; closeExitModal(); document.getElementById('menu-overlay').style.display = 'flex'; }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function changeControlType() {
        controlType = document.getElementById('controlTypeSelect').value;
        document.getElementById('btn-controls').style.display = controlType === 'buttons' ? 'grid' : 'none';
        document.getElementById('joystick-zone').style.display = 'none';
    }

    function setDir(x, y) { player.targetAngle = Math.atan2(y, x); }
    function loginFacebook() { alert("Connected with Facebook successfully! 📘"); }
    function loginGuest() { alert("Logged in as Guest / Email successfully! 👤"); }

    function renderShop() {
        let container = document.getElementById('shopItemsContainer');
        container.innerHTML = "";
        skinsDatabase.forEach(s => {
            let isSelected = player.skin === s.id;
            container.innerHTML += `
                <div class="shop-item">
                    <span>${s.name}</span>
                    <button style="background:${isSelected ? '#27ae60' : '#2980b9'}; padding:5px 10px; cursor:pointer;" onclick="selectSkin('${s.id}')">${isSelected ? 'Equipped' : 'Equip'}</button>
                </div>
            `;
        });
    }

    function selectSkin(id) { 
        player.skin = id; 
        renderShop(); 
    }

    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true; initGame();
        requestAnimationFrame(gameLoop);
    }

    function saveStats() {
        localStorage.setItem('dodio_coins', coins.toString());
        if(score > highScore) { highScore = score; localStorage.setItem('dodio_highscore', highScore.toString()); }
        updateMenuStats();
    }

    function initGame() {
        score = 0; currentMultiplier = 1;
        document.getElementById('scoreVal').innerText = score;
        
        player.alive = true; player.x = MAP_CENTER; player.y = MAP_CENTER;
        player.sizeRadius = 20; player.body = [];
        for(let i=0; i<35; i++) player.body.push({x: player.x - i*8, y: player.y});

        bots = [];
        for(let i=0; i<12; i++) spawnBot(i);

        fruits = [];
        const fTypes = ['🍌', '🍉', '🍒', '🍎', '🍓'];
        for(let i=0; i<1800; i++) {
            let angle = Math.random() * Math.PI * 2;
            let r = Math.random() * (MAP_RADIUS - 300);
            fruits.push({ x: MAP_CENTER + Math.cos(angle)*r, y: MAP_CENTER + Math.sin(angle)*r, type: fTypes[Math.floor(Math.random()*fTypes.length)] });
        }

        coinItems = [];
        for(let i=0; i<300; i++) {
            let angle = Math.random() * Math.PI * 2;
            let r = Math.random() * (MAP_RADIUS - 300);
            coinItems.push({ x: MAP_CENTER + Math.cos(angle)*r, y: MAP_CENTER + Math.sin(angle)*r });
        }

        powerups = [];
        const pTypes = ['🧲', 'x2', 'x4', 'x6', 'x10', '🚀', '🏎️', '🏎️'];
        for(let i=0; i<200; i++) {
            let angle = Math.random() * Math.PI * 2;
            let r = Math.random() * (MAP_RADIUS - 300);
            powerups.push({ x: MAP_CENTER + Math.cos(angle)*r, y: MAP_CENTER + Math.sin(angle)*r, icon: pTypes[Math.floor(Math.random()*pTypes.length)] });
        }
    }

    function spawnBot(id) {
        let angle = Math.random() * Math.PI * 2;
        let r = Math.random() * (MAP_RADIUS - 3000);
        let bx = MAP_CENTER + Math.cos(angle)*r;
        let by = MAP_CENTER + Math.sin(angle)*r;
        let body = [];
        for(let j=0; j<65; j++) body.push({x: bx - j*9, y: by});
        const botNames = ['Apex_Viper', 'Shadow_Hunter', 'Anaconda_King', 'Kurd_Pro', 'Slayer_99', 'Toxic_Bite', 'Alpha_Dragon', 'Speed_Master', 'Mega_Snake', 'Venom_X', 'Titan_Rider', 'Phantom_Bite'];
        bots[id] = { id, name: botNames[id], x: bx, y: by, angle: Math.random()*Math.PI*2, body, score: 2000, alive: true, sizeRadius: 24 };
    }

    function explodeSnake(body) {
        const colors = ['#2ecc71', '#f1c40f', '#e74c3c', '#3498db', '#9b59b6'];
        body.forEach(p => deadRemains.push({ x: p.x, y: p.y, color: colors[Math.floor(Math.random() * colors.length)], spawnTime: Date.now() }));
    }

    // Floating Joystick Controls
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyActive = false, joyCenterX = 0, joyCenterY = 0;

    window.addEventListener('touchstart', (e) => {
        if(!gameRunning || !player.alive || controlType !== 'joystick') return;
        const touch = e.touches[0];
        if(touch.clientX < 110 && touch.clientY < 110) return;

        joyCenterX = touch.clientX; joyCenterY = touch.clientY;
        joyZone.style.left = `${joyCenterX}px`; joyZone.style.top = `${joyCenterY}px`;
        joyZone.style.display = 'block'; joyActive = true;
    });

    window.addEventListener('touchmove', (e) => {
        if(!joyActive || controlType !== 'joystick') return;
        const touch = e.touches[0];
        const dx = touch.clientX - joyCenterX; const dy = touch.clientY - joyCenterY;
        const dist = Math.hypot(dx, dy); const maxDist = 28;
        let knobX = dx, knobY = dy;
        if(dist > maxDist) { knobX = (dx / dist) * maxDist; knobY = (dy / dist) * maxDist; }
        joyKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
        player.targetAngle = Math.atan2(dy, dx);
    });

    window.addEventListener('touchend', () => { joyActive = false; joyZone.style.display = 'none'; });

    const boostBtn = document.getElementById('boost-btn');
    boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); manualSpeedBoost = true; });
    boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); manualSpeedBoost = false; });

    window.addEventListener('touchmove', (e) => {
        if(!gameRunning || !player.alive || controlType !== 'touch') return;
        const touch = e.touches[0];
        player.targetAngle = Math.atan2(touch.clientY - canvas.height/2, touch.clientX - canvas.width/2);
    });

    function addPowerupTimer(name, icon, durationMs, onExpire) {
        let expireTime = Date.now() + durationMs;
        let powerObj = { name, icon, expireTime };
        activePowers.push(powerObj);
        setTimeout(() => {
            let idx = activePowers.indexOf(powerObj);
            if(idx > -1) activePowers.splice(idx, 1);
            if(onExpire) onExpire();
        }, durationMs);
    }

    function renderPowerBadges() {
        let container = document.getElementById('active-powers-container');
        let html = ""; let now = Date.now();
        activePowers.forEach(p => {
            let timeLeft = Math.max(0, Math.ceil((p.expireTime - now) / 1000));
            html += `<div class="power-badge">${p.icon} ${p.name} (${timeLeft}s)</div>`;
        });
        container.innerHTML = html;
    }

    // BEAUTIFUL REALISTIC TRIANGULAR COBRA HEAD
    function drawSnakeHead(p, angle, mainColor, radius) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(angle);
        
        // Triangular Cobra Hood
        ctx.fillStyle = mainColor; ctx.beginPath();
        ctx.moveTo(radius * 2.2, 0); // Nose
        ctx.lineTo(-radius * 0.8, -radius * 1.5); // Left Flare
        ctx.lineTo(-radius * 1.2, 0); // Neck Arc
        ctx.lineTo(-radius * 0.8, radius * 1.5); // Right Flare
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

        // Sharp Eyes
        ctx.fillStyle = '#f1c40f'; ctx.beginPath();
        ctx.ellipse(radius*0.6, -radius*0.5, radius*0.3, radius*0.18, Math.PI*0.1, 0, Math.PI * 2);
        ctx.ellipse(radius*0.6, radius*0.5, radius*0.3, radius*0.18, -Math.PI*0.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath();
        ctx.arc(radius*0.65, -radius*0.5, radius*0.1, 0, Math.PI * 2);
        ctx.arc(radius*0.65, radius*0.5, radius*0.1, 0, Math.PI * 2); ctx.fill();

        // Forked Tongue
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(radius*2.2, 0); ctx.lineTo(radius*3.0, 0);
        ctx.lineTo(radius*3.3, -6); ctx.moveTo(radius*3.0, 0); ctx.lineTo(radius*3.3, 6); ctx.stroke();

        // 5 Magnet Waves
        if(isMagnetActive) {
            let isBlinking = (Math.floor(Date.now() / 120) % 2 === 0);
            ctx.strokeStyle = isBlinking ? '#f1c40f' : '#3498db';
            ctx.lineWidth = isBlinking ? 4 : 2;
            ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = isBlinking ? 16 : 2;

            for(let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.arc(radius * 1.8, 0, radius * 1.5 + (i + 2) * 8, -Math.PI * 0.28, Math.PI * 0.28);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        ctx.restore();
    }

    function updateLeaderboard() {
        let list = [{ name: document.getElementById('playerName').value || "You (Player)", score: score }];
        bots.forEach(b => { if(b.alive) list.push({ name: b.name, score: b.score }); });
        list.sort((a, b) => b.score - a.score);

        let html = "";
        list.slice(0, 10).forEach((item, idx) => {
            let isPlayer = item.name.includes("Player");
            html += `<div style="color:${isPlayer ? '#2ecc71' : '#fff'};">${idx+1}. ${item.name} - ${item.score}</div>`;
        });
        document.getElementById('topList').innerHTML = html;
    }

    function gameLoop(now) {
        if(!gameRunning) return;

        let dt = (now - lastFrameTime) / 1000;
        if(dt > 0.1 || isNaN(dt)) dt = 0.016;
        lastFrameTime = now;

        deadRemains = deadRemains.filter(r => Date.now() - r.spawnTime < 25000);

        if(player.alive) {
            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;

            player.angle += diff * (isSteeringActive ? 12.0 : 6.0) * dt;

            let moveSpeed = (manualSpeedBoost ? 380 : 210) * dt;
            player.x += Math.cos(player.angle) * moveSpeed;
            player.y += Math.sin(player.angle) * moveSpeed;
            player.body.unshift({x: player.x, y: player.y});

            let maxAllowedSegments = Math.min(250, 40 + Math.floor(score / 60));
            while(player.body.length > maxAllowedSegments) player.body.pop();

            let distFromCenter = Math.hypot(player.x - MAP_CENTER, player.y - MAP_CENTER);
            if(distFromCenter >= MAP_RADIUS - 50) {
                player.alive = false; alert("Game Over! You hit the Red Zone!"); location.reload();
            }
            document.getElementById('red-zone-alert').style.display = distFromCenter > MAP_RADIUS - 1200 ? 'block' : 'none';

            bots.forEach(b => {
                if(!b.alive) return;
                b.body.forEach((seg, idx) => {
                    if(idx > 2 && Math.hypot(player.x - seg.x, player.y - seg.y) < player.sizeRadius + b.sizeRadius*0.5) {
                        player.alive = false; alert("Game Over! You crashed into a bot!"); location.reload();
                    }
                });
            });

            // Magnet Effect
            if(isMagnetActive) {
                [fruits, coinItems, powerups, deadRemains].forEach(group => {
                    group.forEach(item => {
                        let d = Math.hypot(player.x - item.x, player.y - item.y);
                        if(d < 550) {
                            item.x += (player.x - item.x) * 6.0 * dt;
                            item.y += (player.y - item.y) * 6.0 * dt;
                        }
                    });
                });
            }

            // Fruits Eating (MULTIPLIES SCORE ACCORDING TO CURRENT MULTIPLIER!)
            fruits.forEach((f) => {
                if(Math.hypot(player.x - f.x, player.y - f.y) < player.sizeRadius + 22) {
                    score += 5 * currentMultiplier; // Multiplied score!
                    document.getElementById('scoreVal').innerText = score;
                    let angle = Math.random() * Math.PI * 2;
                    let r = Math.random() * (MAP_RADIUS - 300);
                    f.x = MAP_CENTER + Math.cos(angle)*r; f.y = MAP_CENTER + Math.sin(angle)*r;
                    if(player.sizeRadius < 36) player.sizeRadius += 0.04;
                }
            });

            // Coins Eating
            coinItems.forEach((c) => {
                if(Math.hypot(player.x - c.x, player.y - c.y) < player.sizeRadius + 20) {
                    coins += 1;
                    document.getElementById('coinVal').innerText = `🪙 ${coins}`;
                    saveStats();
                    let angle = Math.random() * Math.PI * 2;
                    let r = Math.random() * (MAP_RADIUS - 300);
                    c.x = MAP_CENTER + Math.cos(angle)*r; c.y = MAP_CENTER + Math.sin(angle)*r;
                }
            });

            // Dead Remains Eating (MULTIPLIES SCORE TOO!)
            deadRemains.forEach((r, i) => {
                if(Math.hypot(player.x - r.x, player.y - r.y) < player.sizeRadius + 25) {
                    score += 15 * currentMultiplier; // Multiplied score!
                    document.getElementById('scoreVal').innerText = score;
                    deadRemains.splice(i, 1);
                    if(player.sizeRadius < 36) player.sizeRadius += 0.06;
                }
            });

            // Powerups Eating
            powerups.forEach((p) => {
                if(Math.hypot(player.x - p.x, player.y - p.y) < player.sizeRadius + 24) {
                    if(p.icon === '🧲') {
                        isMagnetActive = true;
                        addPowerupTimer('Magnet', '🧲', 15000, () => isMagnetActive = false);
                    }
                    if(p.icon.includes('x')) {
                        let val = parseInt(p.icon.replace('x', '')) || 2;
                        currentMultiplier = val; // Set Multiplier Value!
                        addPowerupTimer(`Multiplier ${p.icon}`, p.icon, 15000, () => currentMultiplier = 1);
                    }
                    if(p.icon === '🚀') {
                        document.getElementById('boost-btn').style.display = 'flex';
                        addPowerupTimer('Boost Button', '🚀', 15000, () => {
                            document.getElementById('boost-btn').style.display = 'none'; manualSpeedBoost = false;
                        });
                    }
                    if(p.icon === '🏎️') {
                        isSteeringActive = true; cameraScale = 0.35;
                        addPowerupTimer('Steering Wheel Zoom', '🏎️', 15000, () => {
                            isSteeringActive = false; cameraScale = 0.50;
                        });
                    }

                    let angle = Math.random() * Math.PI * 2;
                    let r = Math.random() * (MAP_RADIUS - 300);
                    p.x = MAP_CENTER + Math.cos(angle)*r; p.y = MAP_CENTER + Math.sin(angle)*r;
                }
            });
        }

        // Bots Logic
        bots.forEach(b => {
            if(!b.alive) return;
            let distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);
            if(distToPlayer < 1200 && player.alive) {
                b.angle = Math.atan2(player.y - b.y, player.x - b.x);
            } else { b.angle += (Math.random() - 0.5) * 2.0 * dt; }

            let botSpeed = 190 * dt;
            b.x += Math.cos(b.angle) * botSpeed; b.y += Math.sin(b.angle) * botSpeed;
            b.body.unshift({x: b.x, y: b.y}); b.body.pop();

            player.body.forEach((pSeg, idx) => {
                if(idx > 2 && Math.hypot(b.x - pSeg.x, b.y - pSeg.y) < b.sizeRadius) {
                    b.alive = false; explodeSnake(b.body); setTimeout(() => spawnBot(b.id), 300);
                }
            });
        });

        const camX = canvas.width / 2 - player.x * cameraScale;
        const camY = canvas.height / 2 - player.y * cameraScale;

        ctx.fillStyle = '#0f131a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save(); ctx.translate(camX, camY); ctx.scale(cameraScale, cameraScale);

        // Map Border
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 30; ctx.beginPath();
        ctx.arc(MAP_CENTER, MAP_CENTER, MAP_RADIUS, 0, Math.PI * 2); ctx.stroke();

        garages.forEach(g => {
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(g.x - 120, g.y - 120, 240, 240);
            ctx.fillStyle = '#fff'; ctx.font = "bold 24px Arial"; ctx.fillText("GARAGE 🚗", g.x - 60, g.y + 8);
        });

        fruits.forEach(f => { ctx.font = "24px Arial"; ctx.fillText(f.type, f.x, f.y); });
        coinItems.forEach(c => { ctx.font = "22px Arial"; ctx.fillText("🪙", c.x, c.y); });
        deadRemains.forEach(r => { ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(r.x, r.y, 14, 0, Math.PI*2); ctx.fill(); });
        powerups.forEach(p => { ctx.font = "bold 28px Arial"; ctx.fillText(p.icon, p.x, p.y); });

        // Draw Player Body with Gap for Head Visibility
        if(player.alive) {
            let skinObj = skinsDatabase.find(s => s.id === player.skin) || skinsDatabase[0];
            player.body.forEach((p, i) => {
                let color = skinObj.colors[i % skinObj.colors.length];
                if(i === 0) drawSnakeHead(p, player.angle, color, player.sizeRadius);
                else if(i > 1) { // Gap at i=1 for head clearance
                    ctx.fillStyle = color; ctx.beginPath();
                    ctx.arc(p.x, p.y, player.sizeRadius * 0.85, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        // Draw Bots
        bots.forEach(b => {
            if(!b.alive) return;
            b.body.forEach((bp, j) => {
                if(j === 0) drawSnakeHead(bp, b.angle, '#e74c3c', b.sizeRadius);
                else if(j > 1) {
                    ctx.fillStyle = j % 2 === 0 ? '#e74c3c' : '#3498db';
                    ctx.beginPath(); ctx.arc(bp.x, bp.y, b.sizeRadius * 0.8, 0, Math.PI*2); ctx.fill();
                }
            });
        });

        ctx.restore();

        // Radar
        radarCtx.clearRect(0, 0, 75, 75);
        garages.forEach(g => {
            radarCtx.fillStyle = '#2ecc71';
            radarCtx.fillRect(((g.x - (MAP_CENTER - MAP_RADIUS))/(MAP_RADIUS*2))*75 - 3, ((g.y - (MAP_CENTER - MAP_RADIUS))/(MAP_RADIUS*2))*75 - 3, 6, 6);
        });
        if(player.alive) {
            radarCtx.fillStyle = '#ffffff'; radarCtx.beginPath();
            radarCtx.arc(((player.x - (MAP_CENTER - MAP_RADIUS))/(MAP_RADIUS*2))*75, ((player.y - (MAP_CENTER - MAP_RADIUS))/(MAP_RADIUS*2))*75, 4.5, 0, Math.PI*2); radarCtx.fill();
        }
        bots.forEach(b => {
            if(!b.alive) return;
            radarCtx.fillStyle = '#e74c3c'; radarCtx.beginPath();
            radarCtx.arc(((b.x - (MAP_CENTER - MAP_RADIUS))/(MAP_RADIUS*2))*75, ((b.y - (MAP_CENTER - MAP_RADIUS))/(MAP_RADIUS*2))*75, 2.5, 0, Math.PI*2); radarCtx.fill();
        });

        renderPowerBadges(); updateLeaderboard();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
