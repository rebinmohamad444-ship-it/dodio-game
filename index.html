<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shanshen.io</title>
    <style>
        /* زۆر گرنگ: بۆ ئەوەی شاشە ڕەش نەبێت */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50; /* ڕەنگی پشتەوەی گەیم */
        }
        /* شێوازی شۆپ */
        #shop-modal {
            display: none; position: absolute; top: 10px; left: 10px; 
            background: rgba(30, 30, 30, 0.95); color: #fff; padding: 20px; 
            border-radius: 12px; width: 300px; max-width: 90%;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 100;
        }
        #shop-tabs button {
            background: #444; color: #fff; border: none; padding: 8px 15px;
            margin-right: 5px; cursor: pointer; border-radius: 5px;
        }
        #shop-tabs button:hover { background: #f39c12; }
        .shop-list { min-height: 100px; margin-top: 15px; }
        #leaderboard-list { margin-top: 10px; border-top: 1px solid #444; padding-top: 10px; }
        #leaderboard-list ul { list-style: none; padding: 0; margin: 0; }
        #leaderboard-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; font-size: 14px; }
        .close-btn { margin-top: 15px; background: #e74c3c; color: #fff; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 6px;}
    </style>
</head>
<body>

    <!-- کانڤاسی سەرەکی -->
    <canvas id="gameCanvas"></canvas>

    <!-- شۆپ مۆدال -->
    <div id="shop-modal">
        <h3 style="margin-top:0; color:#f39c12;">🛒 Shop</h3>
        <div id="shop-tabs">
            <button onclick="renderShopUI('skins')">Skins</button>
            <button onclick="renderShopUI('flags')">Flags</button>
            <button onclick="renderShopUI('garage')">Garage</button>
        </div>
        <div id="shop-list" class="shop-list">Select a tab to view items...</div>
        
        <!-- لیستی ڕیزبەندی (Leaderboard) -->
        <div id="leaderboard-container">
            <h4 style="margin:10px 0 5px 0; color:#ddd;">🏆 Leaderboard</h4>
            <div id="leaderboard-list">
                <ul><li>Loading data...</li></ul>
            </div>
        </div>
        
        <button class="close-btn" onclick="closeShop()">Close Shop</button>
    </div>

    <!-- سکریپتەکان (زۆر گرنگە ڕێزبەندی ڕێک بێت) -->
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="player.js"></script>
    <script src="bot.js"></script>
    <script src="items.js"></script>
    <script src="shop.js"></script>
    <script src="network.js"></script>
    <script src="ui-manager.js"></script>
    <script src="game-core.js"></script>
</body>
</html>
