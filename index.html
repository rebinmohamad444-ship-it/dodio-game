<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        /* HUD Top Left */
        #radar-wrapper {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 75px; height: 75px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 4px 8px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 10px; margin-top: 4px; text-align: center;
        }

        /* Leaderboard Top Right */
        #leaderboard-box {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.85); padding: 6px 10px;
            border-radius: 8px; border: 1.5px solid #f1c40f;
            font-size: 10px; z-index: 5; min-width: 125px; pointer-events: none;
        }

        #multiplier-badge {
            position: absolute; top: 95px; left: 10px;
            background: rgba(241, 196, 15, 0.9); color: #111;
            padding: 3px 8px; border-radius: 12px; font-weight: bold;
            font-size: 11px; z-index: 5; display: none;
        }

        /* Boost Button */
        #boost-btn {
            position: absolute; bottom: 30px; right: 30px;
            width: 65px; height: 65px;
            background: rgba(231, 76, 60, 0.85);
            border: 2px solid #fff; border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 13px;
            z-index: 10; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 12px #e74c3c;
        }

        /* Menus and Modals */
        #menu-overlay, #shop-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        #shop-modal { display: none; z-index: 30; }

        h1 { font-size: 38px; color: #2ecc71; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 260px; }
        button, select, input {
            padding: 9px; font-size: 12px; border-radius: 12px;
            border: 1.5px solid #2ecc71; background: #181c24; color: #fff; text-align: center; outline: none;
        }
        button { background: #2ecc71; color: #111; font-weight: bold; cursor: pointer; border: none; }
        button.shop-btn { background: #f39c12; color: #fff; }

        .shop-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 250px; overflow-y: auto; width: 85%; max-width: 310px; margin: 12px 0;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #181c24; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; font-size: 11px;
        }
    </style>
</head>
<body>

<div id="radar-wrapper">
    <canvas id="radar-canvas" width="75" height="75"></canvas>
    <div id="hud-stats">
        <div>Score: <span id="scoreVal" style="color:#2ecc71;">0</span></div>
        <div>Coins: <span id="coinVal" style="color:#f1c40f;">🪙 0</span></div>
    </div>
</div>

<div id="multiplier-badge">⚡ 1X</div>

<div id="leaderboard-box">
    <h4 style="color:#f1c40f; text-align:center; margin-bottom:4px; font-size:10px;">🏆 TOP 10 PLAYERS</h4>
    <div id="topList"></div>
</div>

<div id="boost-btn">BOOST</div>

<!-- Main Menu Overlay -->
<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:30px; margin-bottom:8px;">🐍</div>
    
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name">
        <button onclick="startGame()">Play Game 🎮</button>
        <button class="shop-btn" onclick="openShop()">Shop & Skins 🛒</button>
    </div>
</div>

<!-- Shop Modal -->
<div id="shop-modal">
    <h3 style="color:#f39c12; margin-bottom:5px;">Shop & Country Skins 🛒</h3>
    <div style="font-size:12px;">Balance: <span id="shopCoinVal" style="color:#f1c40f; font-weight:bold;">🪙 0</span></div>
    
    <div class="shop-list" id="shopItemsContainer"></div>

    <button onclick="closeShop()" style="width:120px;">Close</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    const MAP_SIZE = 10000;
    let cameraScale = 0.65;
    let gameRunning = false;
    let score = 0, coins = 0;
    
    let currentMultiplier = 1;
    let speedBoost = false;
    let turnAgility = 0.12;

    let player = { x: MAP_SIZE/2, y: MAP_SIZE/2, angle: 0, targetAngle: 0, skin: 'kurdish', body: [], alive: true };
    let bots = [];
    let fruits = [];
    let coinItems = [];
    let powerups = [];
    let deadRemains = []; // Remains stay for 20 seconds

    let ownedSkins = ['kurdish']; // Free Default Skin

    const countrySkins = [
        { id: 'kurdish', name: '✌️ Kurdistan', price: 0 },
        { id: 'brazil', name: '🇧🇷 Brazil', price: 50 },
        { id: 'argentina', name: '🇦🇷 Argentina', price: 50 },
        { id: 'germany', name: '🇩🇪 Germany', price: 50 },
        { id: 'france', name: '🇫🇷 France', price: 50 },
        { id: 'spain', name: '🇪🇸 Spain', price: 50 },
        { id: 'italy', name: '🇮🇹 Italy', price: 50 }
    ];

    // 4 Green Garages
    const garages = [
        { x: 400, y: 400 },
        { x: MAP_SIZE - 400, y: 400 },
        { x: 400, y: MAP_SIZE - 400 },
        { x: MAP_SIZE - 400, y: MAP_SIZE - 400 }
    ];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function openShop() {
        document.getElementById('shopCoinVal').innerText = `🪙 ${coins}`;
        renderShop();
        document.getElementById('shop-modal').style.display = 'flex';
    }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

    function renderShop() {
        let container = document.getElementById('shopItemsContainer');
        container.innerHTML = "<h4 style='color:#2ecc71; margin-top:5px;'>Skins & Flags (50 🪙)</h4>";
        countrySkins.forEach(s => {
            let isOwned = ownedSkins.includes(s.id);
            let isSelected = player.skin === s.id;
            
            container.innerHTML += `
                <div class="shop-item">
                    <span>${s.name}</span>
                    ${isOwned ? 
                        `<button style="background:${isSelected ? '#27ae60' : '#2980b9'}; padding:4px 8px; font-size:10px;" onclick="selectSkin('${s.id}')">${isSelected ? 'Equipped' : 'Equip'}</button>` :
                        `<button class="shop-btn" style="padding:4px 8px; font-size:10px;" onclick="buySkin('${s.id}', ${s.price})">Buy 🪙${s.price}</button>`
                    }
                </div>
            `;
        });
    }

    function buySkin(id, price) {
        if(coins >= price) {
            coins -= price;
            ownedSkins.push(id);
            player.skin = id;
            document.getElementById('coinVal').innerText = `🪙 ${coins}`;
            renderShop();
        } else {
            alert("Not enough coins!");
        }
    }

    function selectSkin(id) {
        player.skin = id;
        renderShop();
    }

    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true;
        initGame();
        gameLoop();
    }

    function initGame() {
        player.alive = true;
        player.x = MAP_SIZE/2; player.y = MAP_SIZE/2;
        player.body = [];
        for(let i=0; i<30; i++) player.body.push({x: player.x - i*6, y: player.y});

        bots = [];
        for(let i=0; i<10; i++) spawnBot(i);

        // 3500 Fruits
        fruits = [];
        const fTypes = ['🍌', '🍉', '🍒', '🍎', '🍓'];
        for(let i=0; i<3500; i++) {
            fruits.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, type: fTypes[Math.floor(Math.random()*fTypes.length)] });
        }

        // Reduced Coins (150 Coins total)
        coinItems = [];
        for(let i=0; i<150; i++) coinItems.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE });

        // Glowing Power-ups
        powerups = [];
        const pTypes = ['🧲', '⚡2X', '⚡4X', '⚡6X', '⚡8X', '⚡10X', '🚀', '☸️', '📷'];
        for(let i=0; i<200; i++) {
            powerups.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, icon: pTypes[Math.floor(Math.random()*pTypes.length)] });
        }
    }

    function spawnBot(id) {
        let bx = Math.random() * (MAP_SIZE - 2000) + 1000;
        let by = Math.random() * (MAP_SIZE - 2000) + 1000;
        let body = [];
        for(let j=0; j<25; j++) body.push({x: bx - j*6, y: by});
        const botNames = ['Pro_Snake', 'Viper_X', 'Anaconda_CN', 'Shadow_99', 'Kurd_King', 'Hunter', 'Toxic_Bite', 'Speedy', 'Alpha_Bot', 'Slayer'];
        bots[id] = { id, name: botNames[id], x: bx, y: by, angle: Math.random()*Math.PI*2, body, score: Math.floor(Math.random()*600+100), alive: true, circleAngle: 0 };
    }

    function explodeSnake(body) {
        body.forEach(p => {
            deadRemains.push({ x: p.x, y: p.y, spawnTime: Date.now() });
        });
    }

    // Touch Boost Event
    const boostBtn = document.getElementById('boost-btn');
    boostBtn.addEventListener('touchstart', () => speedBoost = true);
    boostBtn.addEventListener('touchend', () => speedBoost = false);

    function handlePointer(e) {
        if(!gameRunning || !player.alive) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.targetAngle = Math.atan2(cy - canvas.height/2, cx - canvas.width/2);
    }
    window.addEventListener('touchmove', handlePointer);
    window.addEventListener('mousemove', handlePointer);

    function drawAnacondaHead(p, angle, mainColor) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6, -6, 3, 0, Math.PI * 2);
        ctx.arc(6, 6, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(7, -6, 1.5, 0, Math.PI * 2);
        ctx.arc(7, 6, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(16, 0); ctx.lineTo(24, 0);
        ctx.lineTo(27, -3); ctx.moveTo(24, 0); ctx.lineTo(27, 3);
        ctx.stroke();

        ctx.restore();
    }

    function updateLeaderboard() {
        let list = [{ name: document.getElementById('playerName').value || "Player", score: score }];
        bots.forEach(b => { if(b.alive) list.push({ name: b.name, score: b.score }); });
        list.sort((a, b) => b.score - a.score);

        let html = "";
        list.slice(0, 10).forEach((item, idx) => {
            let isPlayer = item.name === (document.getElementById('playerName').value || "Player");
            html += `<div style="color:${isPlayer ? '#2ecc71' : '#fff'}; font-weight:${isPlayer ? 'bold' : 'normal'}">${idx+1}. ${item.name} - ${item.score}</div>`;
        });
        document.getElementById('topList').innerHTML = html;
    }

    function gameLoop() {
        if(!gameRunning) return;

        let now = Date.now();
        // Remains stay for 20 seconds
        deadRemains = deadRemains.filter(r => now - r.spawnTime < 20000);

        if(player.alive) {
            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            player.angle += diff * turnAgility;

            let currentSpeed = speedBoost ? 6.5 : 3.8;
            player.x += Math.cos(player.angle) * currentSpeed;
            player.y += Math.sin(player.angle) * currentSpeed;
            player.body.unshift({x: player.x, y: player.y});
            player.body.pop();

            // RED ZONE DEATH
            if(player.x <= 20 || player.x >= MAP_SIZE - 20 || player.y <= 20 || player.y >= MAP_SIZE - 20) {
                player.alive = false;
                alert("Game Over! You hit the Red Zone border!");
                location.reload();
            }

            // CRASH INTO BOTS
            bots.forEach(b => {
                if(!b.alive) return;
                b.body.forEach((seg, idx) => {
                    if(idx > 2 && Math.hypot(player.x - seg.x, player.y - seg.y) < 14) {
                        player.alive = false;
                        explodeSnake(player.body);
                        alert("Game Over! You crashed into a snake!");
                        location.reload();
                    }
                });
            });

            // Eat Fruits
            fruits.forEach((f, i) => {
                if(Math.hypot(player.x - f.x, player.y - f.y) < 25) {
                    score += 5 * currentMultiplier;
                    document.getElementById('scoreVal').innerText = score;
                    fruits[i].x = Math.random() * MAP_SIZE;
                    fruits[i].y = Math.random() * MAP_SIZE;
                    player.body.push({...player.body[player.body.length-1]});
                }
            });

            // Eat Dead Remains
            deadRemains.forEach((r, i) => {
                if(Math.hypot(player.x - r.x, player.y - r.y) < 25) {
                    score += 15;
                    document.getElementById('scoreVal').innerText = score;
                    deadRemains.splice(i, 1);
                    player.body.push({...player.body[player.body.length-1]});
                }
            });

            // Eat Coins
            coinItems.forEach((c, i) => {
                if(Math.hypot(player.x - c.x, player.y - c.y) < 22) {
                    coins += 1;
                    document.getElementById('coinVal').innerText = `🪙 ${coins}`;
                    coinItems[i].x = Math.random() * MAP_SIZE;
                    coinItems[i].y = Math.random() * MAP_SIZE;
                }
            });

            // Eat Power-ups
            powerups.forEach((p, i) => {
                if(Math.hypot(player.x - p.x, player.y - p.y) < 28) {
                    if(p.icon.includes('2X')) currentMultiplier = 2;
                    if(p.icon.includes('4X')) currentMultiplier = 4;
                    if(p.icon.includes('6X')) currentMultiplier = 6;
                    if(p.icon.includes('8X')) currentMultiplier = 8;
                    if(p.icon.includes('10X')) currentMultiplier = 10;
                    if(p.icon.includes('☸️')) turnAgility = 0.3; // Steering Wheel Fast Turn
                    if(p.icon.includes('📷')) cameraScale = 0.45; // Camera Zoom Out

                    let badge = document.getElementById('multiplier-badge');
                    badge.innerText = `Active: ${p.icon}`;
                    badge.style.display = 'block';

                    powerups[i].x = Math.random() * MAP_SIZE;
                    powerups[i].y = Math.random() * MAP_SIZE;
                }
            });
        }

        // BOTS LOGIC
        bots.forEach(b => {
            if(!b.alive) return;

            let distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);

            if(distToPlayer < 800 && player.alive) {
                b.circleAngle += 0.05;
                let targetX = player.x + Math.cos(b.circleAngle) * 160;
                let targetY = player.y + Math.sin(b.circleAngle) * 160;
                b.angle = Math.atan2(targetY - b.y, targetX - b.x);
            } else {
                b.angle += (Math.random() - 0.5) * 0.12;
            }

            b.x += Math.cos(b.angle) * 3.6;
            b.y += Math.sin(b.angle) * 3.6;
            b.body.unshift({x: b.x, y: b.y});
            b.body.pop();

            // BOT DEATH IF HITS PLAYER
            player.body.forEach((pSeg, idx) => {
                if(idx > 2 && Math.hypot(b.x - pSeg.x, b.y - pSeg.y) < 14) {
                    b.alive = false;
                    explodeSnake(b.body);
                    setTimeout(() => spawnBot(b.id), 20000); // Respawns after 20 seconds
                }
            });
        });

        // CAMERA RENDERING
        const camX = canvas.width / 2 - player.x * cameraScale;
        const camY = canvas.height / 2 - player.y * cameraScale;

        ctx.fillStyle = '#0f131a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(camX, camY);
        ctx.scale(cameraScale, cameraScale);

        // GRID LINES FOR FOCUS
        ctx.strokeStyle = '#18202d'; ctx.lineWidth = 2;
        for(let x = 0; x < MAP_SIZE; x += 150) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
        }
        for(let y = 0; y < MAP_SIZE; y += 150) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
        }

        // RED ZONE BORDER
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 20;
        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

        // 4 GREEN GARAGES
        garages.forEach(g => {
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(g.x - 120, g.y - 120, 240, 240);
            ctx.fillStyle = '#fff'; ctx.font = "bold 22px Arial";
            ctx.fillText("GARAGE 🚗", g.x - 60, g.y + 8);
        });

        // Draw Fruits
        fruits.forEach(f => { ctx.font = "24px Arial"; ctx.fillText(f.type, f.x, f.y); });

        // Draw Dead Remains (Stay 20s)
        deadRemains.forEach(r => {
            ctx.shadowColor = "#e74c3c"; ctx.shadowBlur = 10;
            ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(r.x, r.y, 8, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        });

        // Draw Coins
        coinItems.forEach(c => { ctx.font = "20px Arial"; ctx.fillText("🪙", c.x, c.y); });

        // Draw Glowing Power-ups
        powerups.forEach(p => {
            ctx.shadowColor = "#f1c40f"; ctx.shadowBlur = 15;
            ctx.font = "bold 28px Arial";
            ctx.fillText(p.icon, p.x, p.y);
            ctx.shadowBlur = 0;
        });

        // Draw Player Snake
        if(player.alive) {
            player.body.forEach((p, i) => {
                if(i === 0) {
                    drawAnacondaHead(p, player.angle, '#00A859');
                } else {
                    ctx.fillStyle = i % 2 === 0 ? '#00A859' : '#ffffff';
                    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        // Draw Bots
        bots.forEach(b => {
            if(!b.alive) return;
            b.body.forEach((bp, j) => {
                if(j === 0) {
                    drawAnacondaHead(bp, b.angle, '#e74c3c');
                } else {
                    ctx.fillStyle = j % 2 === 0 ? '#e74c3c' : '#f39c12';
                    ctx.beginPath(); ctx.arc(bp.x, bp.y, 8, 0, Math.PI*2); ctx.fill();
                }
            });
        });

        ctx.restore();

        // Update Radar
        radarCtx.clearRect(0, 0, 75, 75);
        if(player.alive) {
            radarCtx.fillStyle = '#2ecc71'; radarCtx.beginPath();
            radarCtx.arc((player.x/MAP_SIZE)*75, (player.y/MAP_SIZE)*75, 3.5, 0, Math.PI*2); radarCtx.fill();
        }
        bots.forEach(b => {
            if(!b.alive) return;
            radarCtx.fillStyle = '#e74c3c'; radarCtx.beginPath();
            radarCtx.arc((b.x/MAP_SIZE)*75, (b.y/MAP_SIZE)*75, 2, 0, Math.PI*2); radarCtx.fill();
        });

        updateLeaderboard();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
