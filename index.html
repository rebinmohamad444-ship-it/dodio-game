<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        /* HUD Top Left */
        #radar-wrapper {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 75px; height: 75px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 4px 8px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 10px; margin-top: 4px; text-align: center;
        }
        /* Garages Info under radar */
        #garage-info {
            font-size: 9px; color: #f39c12; background: rgba(0,0,0,0.8);
            padding: 3px 6px; border-radius: 4px; border: 1px solid #f39c12; margin-top: 2px;
        }

        /* Danger Warning Banner */
        #danger-banner {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9); color: #fff; padding: 5px 12px;
            border-radius: 15px; font-weight: bold; font-size: 12px; z-index: 10;
            display: none; animation: flashWarn 0.5s infinite alternate;
        }
        @keyframes flashWarn {
            from { opacity: 1; box-shadow: 0 0 10px #e74c3c; }
            to { opacity: 0.2; box-shadow: none; }
        }

        /* Leaderboard Top Right */
        #leaderboard-box {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.85); padding: 6px 10px;
            border-radius: 8px; border: 1.5px solid #f1c40f;
            font-size: 10px; z-index: 5; min-width: 125px; pointer-events: none;
        }

        #multiplier-badge {
            position: absolute; top: 110px; left: 10px;
            background: rgba(241, 196, 15, 0.95); color: #111;
            padding: 4px 10px; border-radius: 12px; font-weight: bold;
            font-size: 11px; z-index: 5; display: none;
            box-shadow: 0 0 10px #f1c40f;
        }

        /* Menus and Modals */
        #menu-overlay, #shop-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        #shop-modal { display: none; z-index: 30; }

        h1 { font-size: 38px; color: #2ecc71; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 260px; }
        button, select, input {
            padding: 9px; font-size: 12px; border-radius: 12px;
            border: 1.5px solid #2ecc71; background: #181c24; color: #fff; text-align: center; outline: none;
        }
        button { background: #2ecc71; color: #111; font-weight: bold; cursor: pointer; border: none; }
        button.shop-btn { background: #f39c12; color: #fff; }

        .shop-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 260px; overflow-y: auto; width: 85%; max-width: 310px; margin: 12px 0;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #181c24; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; font-size: 11px;
        }
    </style>
</head>
<body>

<div id="danger-banner">⚠️ RED ZONE WARNING! ⚠️</div>

<div id="radar-wrapper">
    <canvas id="radar-canvas" width="75" height="75"></canvas>
    <div id="hud-stats">
        <div>Score: <span id="scoreVal" style="color:#2ecc71;">0</span></div>
        <div>Coins: <span id="coinVal" style="color:#f1c40f;">🪙 0</span></div>
    </div>
    <div id="garage-info">🚗 4 Garages Active</div>
</div>

<div id="multiplier-badge">⚡ 1X</div>

<div id="leaderboard-box">
    <h4 style="color:#f1c40f; text-align:center; margin-bottom:4px; font-size:10px;">🏆 TOP 10 PLAYERS</h4>
    <div id="topList"></div>
</div>

<!-- Main Menu Overlay -->
<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:30px; margin-bottom:8px;">🐍</div>
    
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name">
        <button onclick="startGame()">Play Game 🎮</button>
        <button class="shop-btn" onclick="openShop()">Shop & Skins 🛒</button>
    </div>
</div>

<!-- Shop Modal -->
<div id="shop-modal">
    <h3 style="color:#f39c12; margin-bottom:5px;">Skins & Flags Shop 🛒</h3>
    <div style="font-size:12px;">Balance: <span id="shopCoinVal" style="color:#f1c40f; font-weight:bold;">🪙 0</span></div>
    
    <div class="shop-list" id="shopItemsContainer"></div>

    <button onclick="closeShop()" style="width:120px;">Close</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    const MAP_SIZE = 10000;
    let cameraScale = 0.65; // Default zoom
    let gameRunning = false;
    let score = 0, coins = 0;
    
    let totalMultiplier = 1;
    let activeMultipliers = [];
    let isMagnetActive = false;
    let isBoostActive = false;
    let turnAgility = 0.12;

    let player = { x: MAP_SIZE/2, y: MAP_SIZE/2, angle: 0, targetAngle: 0, skin: 'kurdish', body: [], alive: true, thickness: 8 };
    let bots = [];
    let fruits = [];
    let coinItems = [];
    let powerups = [];
    let deadRemains = [];

    const garages = [
        { x: 400, y: 400 },
        { x: MAP_SIZE - 400, y: 400 },
        { x: 400, y: MAP_SIZE - 400 },
        { x: MAP_SIZE - 400, y: MAP_SIZE - 400 }
    ];

    const skinsDatabase = [
        { id: 'free1', name: '🟢 Lime Green', price: 0, color: '#2ecc71' },
        { id: 'free2', name: '🔵 Sky Blue', price: 0, color: '#3498db' },
        { id: 'free3', name: '🔴 Ruby Red', price: 0, color: '#e74c3c' },
        { id: 'free4', name: '🟡 Bright Yellow', price: 0, color: '#f1c40f' },
        { id: 'free5', name: '🟣 Royal Purple', price: 0, color: '#9b59b6' },
        { id: 'free6', name: '🟠 Sunset Orange', price: 0, color: '#e67e22' },
        { id: 'free7', name: '⚪ Pure White', price: 0, color: '#ffffff' },
        { id: 'free8', name: '⚫ Dark Shadow', price: 0, color: '#34495e' },
        { id: 'free9', name: '💖 Neon Pink', price: 0, color: '#ff6b81' },
        { id: 'free10', name: '🌊 Cyan Ocean', price: 0, color: '#1abc9c' },
        { id: 'free11', name: '🌲 Deep Forest', price: 0, color: '#27ae60' },
        { id: 'free12', name: '🔥 Fire Red', price: 0, color: '#c0392b' },
        { id: 'free13', name: '🪙 Gold Luxury', price: 0, color: '#d35400' },
        { id: 'free14', name: '🪐 Indigo Night', price: 0, color: '#2c3e50' },
        { id: 'free15', name: '🌸 Cherry Blossom', price: 0, color: '#ff7979' },
        { id: 'kurdish', name: '✌️ Kurdistan', price: 100, color: '#00A859' },
        { id: 'brazil', name: '🇧🇷 Brazil', price: 100, color: '#FFDF00' },
        { id: 'argentina', name: '🇦🇷 Argentina', price: 100, color: '#74ACDF' },
        { id: 'germany', name: '🇩🇪 Germany', price: 100, color: '#DD0000' },
        { id: 'france', name: '🇫🇷 France', price: 100, color: '#002395' },
        { id: 'spain', name: '🇪🇸 Spain', price: 100, color: '#AA152B' },
        { id: 'italy', name: '🇮🇹 Italy', price: 100, color: '#009246' }
    ];

    let ownedSkins = skinsDatabase.filter(s => s.price === 0).map(s => s.id);

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function openShop() {
        document.getElementById('shopCoinVal').innerText = `🪙 ${coins}`;
        renderShop();
        document.getElementById('shop-modal').style.display = 'flex';
    }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

    function renderShop() {
        let container = document.getElementById('shopItemsContainer');
        container.innerHTML = "<h4 style='color:#2ecc71; margin-top:5px;'>15 Free Skins & Flag Skins (100 🪙)</h4>";
        skinsDatabase.forEach(s => {
            let isOwned = ownedSkins.includes(s.id);
            let isSelected = player.skin === s.id;
            
            container.innerHTML += `
                <div class="shop-item">
                    <span>${s.name}</span>
                    ${isOwned ? 
                        `<button style="background:${isSelected ? '#27ae60' : '#2980b9'}; padding:4px 8px; font-size:10px;" onclick="selectSkin('${s.id}')">${isSelected ? 'Equipped' : 'Equip'}</button>` :
                        `<button class="shop-btn" style="padding:4px 8px; font-size:10px;" onclick="buySkin('${s.id}', ${s.price})">Buy 🪙${s.price}</button>`
                    }
                </div>
            `;
        });
    }

    function buySkin(id, price) {
        if(coins >= price) {
            coins -= price;
            ownedSkins.push(id);
            player.skin = id;
            document.getElementById('coinVal').innerText = `🪙 ${coins}`;
            renderShop();
        } else {
            alert("Not enough coins!");
        }
    }

    function selectSkin(id) {
        player.skin = id;
        renderShop();
    }

    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true;
        initGame();
        gameLoop();
    }

    function initGame() {
        player.alive = true;
        player.x = MAP_SIZE/2; player.y = MAP_SIZE/2;
        player.body = [];
        player.thickness = 8;
        for(let i=0; i<30; i++) player.body.push({x: player.x - i*6, y: player.y});

        bots = [];
        for(let i=0; i<10; i++) spawnBot(i);

        fruits = [];
        const fTypes = ['🍌', '🍉', '🍒', '🍎', '🍓'];
        for(let i=0; i<3500; i++) {
            fruits.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, type: fTypes[Math.floor(Math.random()*fTypes.length)] });
        }

        coinItems = [];
        for(let i=0; i<200; i++) coinItems.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE });

        powerups = [];
        const pTypes = ['🧲', 'x2', 'x4', 'x6', 'x8', 'x10', '🚀', '☸️', '🎯']; // 🎯 Sniper/Scope Camera
        for(let i=0; i<250; i++) {
            powerups.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, icon: pTypes[Math.floor(Math.random()*pTypes.length)] });
        }
    }

    function spawnBot(id) {
        let bx = Math.random() * (MAP_SIZE - 2000) + 1000;
        let by = Math.random() * (MAP_SIZE - 2000) + 1000;
        let body = [];
        for(let j=0; j<25; j++) body.push({x: bx - j*6, y: by});
        const botNames = ['Pro_Snake', 'Viper_X', 'Anaconda_CN', 'Shadow_99', 'Kurd_King', 'Hunter', 'Toxic_Bite', 'Speedy', 'Alpha_Bot', 'Slayer'];
        bots[id] = { id, name: botNames[id], x: bx, y: by, angle: Math.random()*Math.PI*2, body, score: Math.floor(Math.random()*600+100), alive: true, circleAngle: 0 };
    }

    function explodeSnake(body) {
        body.forEach(p => {
            deadRemains.push({ x: p.x, y: p.y, spawnTime: Date.now() });
        });
    }

    function addMultiplier(val) {
        activeMultipliers.push(val);
        recalculateMultipliers();
        setTimeout(() => {
            let idx = activeMultipliers.indexOf(val);
            if(idx > -1) activeMultipliers.splice(idx, 1);
            recalculateMultipliers();
        }, 15000);
    }

    function recalculateMultipliers() {
        totalMultiplier = activeMultipliers.reduce((a, b) => a + b, 0);
        if(totalMultiplier === 0) totalMultiplier = 1;
        
        let badge = document.getElementById('multiplier-badge');
        if(activeMultipliers.length > 0) {
            badge.innerText = `Active: ${activeMultipliers.map(x => 'x'+x).join(' + ')} = x${totalMultiplier}!`;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }
    }

    function handlePointer(e) {
        if(!gameRunning || !player.alive) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.targetAngle = Math.atan2(cy - canvas.height/2, cx - canvas.width/2);
    }
    window.addEventListener('touchmove', handlePointer);
    window.addEventListener('mousemove', handlePointer);

    function drawAnacondaHead(p, angle, mainColor, sizeRadius) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, sizeRadius * 1.5, sizeRadius * 1.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sizeRadius * 0.5, -sizeRadius * 0.4, sizeRadius * 0.25, 0, Math.PI * 2);
        ctx.arc(sizeRadius * 0.5, sizeRadius * 0.4, sizeRadius * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(sizeRadius * 0.6, -sizeRadius * 0.4, sizeRadius * 0.12, 0, Math.PI * 2);
        ctx.arc(sizeRadius * 0.6, sizeRadius * 0.4, sizeRadius * 0.12, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sizeRadius * 1.5, 0); ctx.lineTo(sizeRadius * 2.2, 0);
        ctx.lineTo(sizeRadius * 2.5, -3); ctx.moveTo(sizeRadius * 2.2, 0); ctx.lineTo(sizeRadius * 2.5, 3);
        ctx.stroke();

        ctx.restore();
    }

    function updateLeaderboard() {
        let list = [{ name: document.getElementById('playerName').value || "Player", score: score }];
        bots.forEach(b => { if(b.alive) list.push({ name: b.name, score: b.score }); });
        list.sort((a, b) => b.score - a.score);

        let html = "";
        list.slice(0, 10).forEach((item, idx) => {
            let isPlayer = item.name === (document.getElementById('playerName').value || "Player");
            html += `<div style="color:${isPlayer ? '#2ecc71' : '#fff'}; font-weight:${isPlayer ? 'bold' : 'normal'}">${idx+1}. ${item.name} - ${item.score}</div>`;
        });
        document.getElementById('topList').innerHTML = html;
    }

    function gameLoop() {
        if(!gameRunning) return;

        let now = Date.now();
        deadRemains = deadRemains.filter(r => now - r.spawnTime < 20000);

        if(player.alive) {
            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            player.angle += diff * turnAgility;

            let currentSpeed = isBoostActive ? 6.2 : 3.6;
            player.x += Math.cos(player.angle) * currentSpeed;
            player.y += Math.sin(player.angle) * currentSpeed;
            player.body.unshift({x: player.x, y: player.y});
            player.body.pop();

            // Balanced thickness (Not too thick)
            player.thickness = Math.min(14, 8 + Math.floor(player.body.length / 30));

            // RED ZONE CHECK & WARNING BANNER
            if(player.x <= 300 || player.x >= MAP_SIZE - 300 || player.y <= 300 || player.y >= MAP_SIZE - 300) {
                document.getElementById('danger-banner').style.display = 'block';
            } else {
                document.getElementById('danger-banner').style.display = 'none';
            }

            if(player.x <= 20 || player.x >= MAP_SIZE - 20 || player.y <= 20 || player.y >= MAP_SIZE - 20) {
                player.alive = false;
                alert("Game Over! You hit the Red Zone border!");
                location.reload();
            }

            // CRASH INTO BOTS
            bots.forEach(b => {
                if(!b.alive) return;
                b.body.forEach((seg, idx) => {
                    if(idx > 2 && Math.hypot(player.x - seg.x, player.y - seg.y) < player.thickness + 3) {
                        player.alive = false;
                        explodeSnake(player.body);
                        alert("Game Over! You crashed into a snake!");
                        location.reload();
                    }
                });
            });

            // MAGNET: Pull EVERYTHING (Fruits, Coins, Powerups)
            if(isMagnetActive) {
                fruits.forEach(f => {
                    if(Math.hypot(player.x - f.x, player.y - f.y) < 400) {
                        f.x += (player.x - f.x) * 0.12;
                        f.y += (player.y - f.y) * 0.12;
                    }
                });
                coinItems.forEach(c => {
                    if(Math.hypot(player.x - c.x, player.y - c.y) < 400) {
                        c.x += (player.x - c.x) * 0.12;
                        c.y += (player.y - c.y) * 0.12;
                    }
                });
                powerups.forEach(p => {
                    if(Math.hypot(player.x - p.x, player.y - p.y) < 400) {
                        p.x += (player.x - p.x) * 0.12;
                        p.y += (player.y - p.y) * 0.12;
                    }
                });
            }

            // Eat Fruits
            fruits.forEach((f, i) => {
                if(Math.hypot(player.x - f.x, player.y - f.y) < player.thickness + 10) {
                    score += 5 * totalMultiplier;
                    document.getElementById('scoreVal').innerText = score;
                    fruits[i].x = Math.random() * MAP_SIZE;
                    fruits[i].y = Math.random() * MAP_SIZE;
                    player.body.push({...player.body[player.body.length-1]});
                }
            });

            // Eat Dead Remains
            deadRemains.forEach((r, i) => {
                if(Math.hypot(player.x - r.x, player.y - r.y) < player.thickness + 10) {
                    score += 15;
                    document.getElementById('scoreVal').innerText = score;
                    deadRemains.splice(i, 1);
                    player.body.push({...player.body[player.body.length-1]});
                }
            });

            // Eat Coins
            coinItems.forEach((c, i) => {
                if(Math.hypot(player.x - c.x, player.y - c.y) < player.thickness + 8) {
                    coins += 1;
                    document.getElementById('coinVal').innerText = `🪙 ${coins}`;
                    coinItems[i].x = Math.random() * MAP_SIZE;
                    coinItems[i].y = Math.random() * MAP_SIZE;
                }
            });

            // Eat Power-ups
            powerups.forEach((p, i) => {
                if(Math.hypot(player.x - p.x, player.y - p.y) < player.thickness + 12) {
                    if(p.icon === 'x2') addMultiplier(2);
                    if(p.icon === 'x4') addMultiplier(4);
                    if(p.icon === 'x6') addMultiplier(6);
                    if(p.icon === 'x8') addMultiplier(8);
                    if(p.icon === 'x10') addMultiplier(10);
                    
                    if(p.icon === '🧲') {
                        isMagnetActive = true;
                        setTimeout(() => isMagnetActive = false, 15000);
                    }
                    if(p.icon === '🚀') {
                        isBoostActive = true;
                        setTimeout(() => isBoostActive = false, 15000);
                    }
                    if(p.icon === '☸️') {
                        turnAgility = 0.3;
                        setTimeout(() => turnAgility = 0.12, 15000);
                    }
                    if(p.icon === '🎯') { // Sniper/Scope Zoom Out
                        cameraScale = 0.4;
                        setTimeout(() => cameraScale = 0.65, 15000);
                    }

                    powerups[i].x = Math.random() * MAP_SIZE;
                    powerups[i].y = Math.random() * MAP_SIZE;
                }
            });
        }

        // BOTS LOGIC
        bots.forEach(b => {
            if(!b.alive) return;
            let distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);

            if(distToPlayer < 800 && player.alive) {
                b.circleAngle += 0.05;
                let targetX = player.x + Math.cos(b.circleAngle) * 160;
                let targetY = player.y + Math.sin(b.circleAngle) * 160;
                b.angle = Math.atan2(targetY - b.y, targetX - b.x);
            } else {
                b.angle += (Math.random() - 0.5) * 0.12;
            }

            b.x += Math.cos(b.angle) * 3.4;
            b.y += Math.sin(b.angle) * 3.4;
            b.body.unshift({x: b.x, y: b.y});
            b.body.pop();

            player.body.forEach((pSeg, idx) => {
                if(idx > 2 && Math.hypot(b.x - pSeg.x, b.y - pSeg.y) < player.thickness + 3) {
                    b.alive = false;
                    explodeSnake(b.body);
                    setTimeout(() => spawnBot(b.id), 20000);
                }
            });
        });

        // CAMERA RENDERING
        const camX = canvas.width / 2 - player.x * cameraScale;
        const camY = canvas.height / 2 - player.y * cameraScale;

        ctx.fillStyle = '#0f131a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(camX, camY);
        ctx.scale(cameraScale, cameraScale);

        // GRID LINES
        ctx.strokeStyle = '#18202d'; ctx.lineWidth = 2;
        for(let x = 0; x < MAP_SIZE; x += 150) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
        }
        for(let y = 0; y < MAP_SIZE; y += 150) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
        }

        // GARAGES
        garages.forEach(g => {
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(g.x - 120, g.y - 120, 240, 240);
            ctx.fillStyle = '#fff'; ctx.font = "bold 22px Arial";
            ctx.fillText("GARAGE 🚗", g.x - 60, g.y + 8);
        });

        // RED ZONE
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 20;
        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

        // Draw Fruits
        fruits.forEach(f => { ctx.font = "24px Arial"; ctx.fillText(f.type, f.x, f.y); });

        // Draw Glowing/Flashing Dead Remains (Stay 20s)
        deadRemains.forEach(r => {
            ctx.shadowColor = "#e74c3c"; ctx.shadowBlur = 15;
            ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#f39c12' : '#e74c3c';
            ctx.beginPath(); ctx.arc(r.x, r.y, 9, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        });

        // Draw Coins
        coinItems.forEach(c => { ctx.font = "20px Arial"; ctx.fillText("🪙", c.x, c.y); });

        // Draw Power-ups
        powerups.forEach(p => {
            ctx.shadowColor = "#f1c40f"; ctx.shadowBlur = 12;
            ctx.font = "bold 28px Arial";
            ctx.fillText(p.icon, p.x, p.y);
            ctx.shadowBlur = 0;
        });

        // Draw Player Snake
        if(player.alive) {
            let activeSkinObj = skinsDatabase.find(s => s.id === player.skin) || skinsDatabase[0];
            player.body.forEach((p, i) => {
                if(i === 0) {
                    drawAnacondaHead(p, player.angle, activeSkinObj.color, player.thickness);
                } else {
                    ctx.fillStyle = i % 2 === 0 ? activeSkinObj.color : '#ffffff';
                    ctx.beginPath(); ctx.arc(p.x, p.y, player.thickness, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        // Draw Bots
        bots.forEach(b => {
            if(!b.alive) return;
            b.body.forEach((bp, j) => {
                if(j === 0) {
                    drawAnacondaHead(bp, b.angle, '#e74c3c', 9);
                } else {
                    ctx.fillStyle = j % 2 === 0 ? '#e74c3c' : '#f39c12';
                    ctx.beginPath(); ctx.arc(bp.x, bp.y, 8, 0, Math.PI*2); ctx.fill();
                }
            });
        });

        ctx.restore();

        // Update Radar
        radarCtx.clearRect(0, 0, 75, 75);
        if(player.alive) {
            radarCtx.fillStyle = '#2ecc71'; radarCtx.beginPath();
            radarCtx.arc((player.x/MAP_SIZE)*75, (player.y/MAP_SIZE)*75, 3.5, 0, Math.PI*2); radarCtx.fill();
        }
        bots.forEach(b => {
            if(!b.alive) return;
            radarCtx.fillStyle = '#e74c3c'; radarCtx.beginPath();
            radarCtx.arc((b.x/MAP_SIZE)*75, (b.y/MAP_SIZE)*75, 2, 0, Math.PI*2); radarCtx.fill();
        });

        updateLeaderboard();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
