<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        /* HUD Top Left */
        #radar-wrapper {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 75px; height: 75px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 4px 8px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 10px; margin-top: 4px; text-align: center;
        }

        #leaderboard-box {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.85); padding: 6px 10px;
            border-radius: 8px; border: 1.5px solid #f1c40f;
            font-size: 10px; z-index: 5; min-width: 130px; pointer-events: none;
        }

        #multiplier-badge {
            position: absolute; top: 110px; left: 10px;
            background: rgba(241, 196, 15, 0.95); color: #111;
            padding: 4px 10px; border-radius: 12px; font-weight: bold;
            font-size: 11px; z-index: 5; display: none;
            box-shadow: 0 0 10px #f1c40f;
        }

        /* Boost Button */
        #boost-btn {
            position: absolute; bottom: 35px; right: 25px;
            width: 60px; height: 60px;
            background: rgba(231, 76, 60, 0.85);
            border: 2px solid #fff; border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 12px;
            z-index: 10; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px #e74c3c;
        }

        /* Menus and Modals */
        #menu-overlay, #shop-modal, #settings-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        #shop-modal, #settings-modal { display: none; z-index: 30; }

        h1 { font-size: 38px; color: #2ecc71; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 260px; }
        button, select, input {
            padding: 9px; font-size: 12px; border-radius: 12px;
            border: 1.5px solid #2ecc71; background: #181c24; color: #fff; text-align: center; outline: none;
        }
        button { background: #2ecc71; color: #111; font-weight: bold; cursor: pointer; border: none; }
        button.shop-btn { background: #f39c12; color: #fff; }

        .shop-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 250px; overflow-y: auto; width: 85%; max-width: 310px; margin: 12px 0;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #181c24; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; font-size: 11px;
        }
    </style>
</head>
<body>

<div id="radar-wrapper">
    <canvas id="radar-canvas" width="75" height="75"></canvas>
    <div id="hud-stats">
        <div>Score: <span id="scoreVal" style="color:#2ecc71;">0</span></div>
        <div>Coins: <span id="coinVal" style="color:#f1c40f;">🪙 0</span></div>
    </div>
</div>

<div id="multiplier-badge">⚡ 1X</div>

<div id="leaderboard-box">
    <h4 style="color:#f1c40f; text-align:center; margin-bottom:4px; font-size:10px;">🏆 TOP 10 PLAYERS</h4>
    <div id="topList"></div>
</div>

<div id="boost-btn">BOOST</div>

<!-- Main Menu Overlay -->
<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:30px; margin-bottom:8px;">🐍</div>
    
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name">
        <button onclick="startGame()">PLAY GAME 🎮</button>
        <button class="shop-btn" onclick="openShop()">Shop & Garage 🛒</button>
        <button style="background:#e67e22; color:#fff;" onclick="openSettings()">Settings ⚙️</button>
    </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal">
    <h3 style="color:#e67e22; margin-bottom:10px;">Settings ⚙️</h3>
    <div class="btn-group">
        <label style="font-size:11px;">Control Style:</label>
        <select id="controlTypeSelect">
            <option value="touch">Touch / Mouse Angle</option>
        </select>
        <button onclick="closeSettings()">Save & Back</button>
    </div>
</div>

<!-- Shop Modal -->
<div id="shop-modal">
    <h3 style="color:#f39c12; margin-bottom:5px;">Shop & Garages 🛒</h3>
    <div style="font-size:12px;">Saved Coins: <span id="shopCoinVal" style="color:#f1c40f; font-weight:bold;">🪙 0</span></div>
    
    <div class="shop-list" id="shopItemsContainer"></div>

    <button onclick="closeShop()" style="width:120px;">Close</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    const MAP_SIZE = 14000;
    let cameraScale = 0.65;
    let gameRunning = false;
    
    // Load saved coins & high score
    let coins = parseInt(localStorage.getItem('dodio_coins') || '0');
    let highScore = parseInt(localStorage.getItem('dodio_highscore') || '0');
    let score = 0;

    let currentMultiplier = 1;
    let speedBoost = false;
    let isMagnetActive = false;
    let magnetTimer = null;

    let player = { x: MAP_SIZE/2, y: MAP_SIZE/2, angle: 0, targetAngle: 0, body: [], alive: true, sizeRadius: 16 };
    let bots = [];
    let fruits = [];
    let coinItems = [];
    let powerups = [];

    const garages = [
        { x: 500, y: 500 },
        { x: MAP_SIZE - 500, y: 500 },
        { x: 500, y: MAP_SIZE - 500 },
        { x: MAP_SIZE - 500, y: MAP_SIZE - 500 }
    ];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    document.getElementById('coinVal').innerText = `🪙 ${coins}`;

    function openShop() {
        document.getElementById('shopCoinVal').innerText = `🪙 ${coins}`;
        document.getElementById('shop-modal').style.display = 'flex';
    }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true;
        initGame();
        gameLoop();
    }

    function saveStats() {
        localStorage.setItem('dodio_coins', coins.toString());
        if(score > highScore) {
            localStorage.setItem('dodio_highscore', score.toString());
        }
    }

    function initGame() {
        score = 0;
        document.getElementById('scoreVal').innerText = score;
        
        player.alive = true;
        player.x = MAP_SIZE/2; player.y = MAP_SIZE/2;
        player.sizeRadius = 16;
        player.body = [];
        for(let i=0; i<30; i++) player.body.push({x: player.x - i*6, y: player.y});

        // 10 Aggressive Smart Bots
        bots = [];
        for(let i=0; i<10; i++) spawnBot(i);

        // Fruits
        fruits = [];
        const fTypes = ['🍌', '🍉', '🍒', '🍎', '🍓'];
        for(let i=0; i<3500; i++) {
            fruits.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, type: fTypes[Math.floor(Math.random()*fTypes.length)] });
        }

        // Coins
        coinItems = [];
        for(let i=0; i<200; i++) coinItems.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE });

        // Power-ups
        powerups = [];
        const pTypes = ['🧲', '⚡2X', '⚡4X', '⚡6X', '⚡10X', '🚀', '📷'];
        for(let i=0; i<220; i++) {
            powerups.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, icon: pTypes[Math.floor(Math.random()*pTypes.length)] });
        }
    }

    function spawnBot(id) {
        let bx = Math.random() * (MAP_SIZE - 2000) + 1000;
        let by = Math.random() * (MAP_SIZE - 2000) + 1000;
        let body = [];
        for(let j=0; j<25; j++) body.push({x: bx - j*6, y: by});
        const botNames = ['Apex_Viper', 'Shadow_Hunter', 'Anaconda_King', 'Kurd_Pro', 'Slayer_99', 'Toxic_Bite', 'Alpha_Dragon', 'Speed_Master', 'Mega_Snake', 'Venom_X'];
        bots[id] = { id, name: botNames[id], x: bx, y: by, angle: Math.random()*Math.PI*2, body, score: Math.floor(Math.random()*300+50), alive: true, circleAngle: 0, sizeRadius: 14 };
    }

    // Touch Boost Controls
    const boostBtn = document.getElementById('boost-btn');
    boostBtn.addEventListener('touchstart', () => speedBoost = true);
    boostBtn.addEventListener('touchend', () => speedBoost = false);
    boostBtn.addEventListener('mousedown', () => speedBoost = true);
    boostBtn.addEventListener('mouseup', () => speedBoost = false);

    function handlePointer(e) {
        if(!gameRunning || !player.alive) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.targetAngle = Math.atan2(cy - canvas.height/2, cx - canvas.width/2);
    }
    window.addEventListener('touchmove', handlePointer);
    window.addEventListener('mousemove', handlePointer);

    function drawAnacondaHead(p, angle, mainColor, radius) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        
        // Anaconda Head Outer
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 1.5, radius * 1.1, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(radius*0.5, -radius*0.4, radius*0.25, 0, Math.PI * 2);
        ctx.arc(radius*0.5, radius*0.4, radius*0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(radius*0.6, -radius*0.4, radius*0.12, 0, Math.PI * 2);
        ctx.arc(radius*0.6, radius*0.4, radius*0.12, 0, Math.PI * 2);
        ctx.fill();

        // Forked Tongue
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(radius*1.5, 0); ctx.lineTo(radius*2.2, 0);
        ctx.lineTo(radius*2.5, -4); ctx.moveTo(radius*2.2, 0); ctx.lineTo(radius*2.5, 4);
        ctx.stroke();

        // 4 RED MAGNET LINES IN FRONT OF HEAD
        if(isMagnetActive) {
            ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5;
            for(let i = -1.5; i <= 1.5; i += 1) {
                ctx.beginPath();
                ctx.moveTo(radius*1.8, i * 6);
                ctx.lineTo(radius*3.2, i * 10);
                ctx.stroke();
            }
        }

        ctx.restore();
    }

    function updateLeaderboard() {
        let list = [{ name: document.getElementById('playerName').value || "You (Player)", score: score }];
        bots.forEach(b => { if(b.alive) list.push({ name: b.name, score: b.score }); });
        list.sort((a, b) => b.score - a.score);

        let html = "";
        list.slice(0, 10).forEach((item, idx) => {
            let isPlayer = item.name.includes("Player");
            html += `<div style="color:${isPlayer ? '#2ecc71' : '#fff'}; font-weight:${isPlayer ? 'bold' : 'normal'}">${idx+1}. ${item.name} - ${item.score}</div>`;
        });
        document.getElementById('topList').innerHTML = html;
    }

    function gameLoop() {
        if(!gameRunning) return;

        if(player.alive) {
            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            player.angle += diff * 0.14;

            // Base Speed + Boost
            let currentSpeed = speedBoost ? 7.8 : 4.8;
            player.x += Math.cos(player.angle) * currentSpeed;
            player.y += Math.sin(player.angle) * currentSpeed;
            player.body.unshift({x: player.x, y: player.y});
            player.body.pop();

            // Red Zone Death
            if(player.x <= 20 || player.x >= MAP_SIZE - 20 || player.y <= 20 || player.y >= MAP_SIZE - 20) {
                player.alive = false;
                saveStats();
                alert("Game Over! You hit the Red Zone!");
                location.reload();
            }

            // Player Crashes into Bots
            bots.forEach(b => {
                if(!b.alive) return;
                b.body.forEach((seg, idx) => {
                    if(idx > 2 && Math.hypot(player.x - seg.x, player.y - seg.y) < player.sizeRadius + 2) {
                        player.alive = false;
                        saveStats();
                        alert("Game Over! You crashed into a bot!");
                        location.reload();
                    }
                });
            });

            // MAGNET ATTRACTS ALL ITEMS
            if(isMagnetActive) {
                [fruits, coinItems, powerups].forEach(group => {
                    group.forEach(item => {
                        let d = Math.hypot(player.x - item.x, player.y - item.y);
                        if(d < 350) {
                            item.x += (player.x - item.x) * 0.12;
                            item.y += (player.y - item.y) * 0.12;
                        }
                    });
                });
            }

            // Eat Fruits
            fruits.forEach((f, i) => {
                if(Math.hypot(player.x - f.x, player.y - f.y) < player.sizeRadius + 10) {
                    score += 5 * currentMultiplier;
                    document.getElementById('scoreVal').innerText = score;
                    fruits[i].x = Math.random() * MAP_SIZE;
                    fruits[i].y = Math.random() * MAP_SIZE;
                    player.body.push({...player.body[player.body.length-1]});
                    if(player.body.length % 20 === 0) player.sizeRadius += 0.5;
                }
            });

            // Eat Coins
            coinItems.forEach((c, i) => {
                if(Math.hypot(player.x - c.x, player.y - c.y) < player.sizeRadius + 8) {
                    coins += 1;
                    document.getElementById('coinVal').innerText = `🪙 ${coins}`;
                    saveStats();
                    coinItems[i].x = Math.random() * MAP_SIZE;
                    coinItems[i].y = Math.random() * MAP_SIZE;
                }
            });

            // Eat Power-ups
            powerups.forEach((p, i) => {
                if(Math.hypot(player.x - p.x, player.y - p.y) < player.sizeRadius + 10) {
                    if(p.icon === '🧲') {
                        isMagnetActive = true;
                        if(magnetTimer) clearTimeout(magnetTimer);
                        magnetTimer = setTimeout(() => isMagnetActive = false, 15000);
                    }
                    if(p.icon.includes('2X')) currentMultiplier = 2;
                    if(p.icon.includes('4X')) currentMultiplier = 4;
                    if(p.icon.includes('6X')) currentMultiplier = 6;
                    if(p.icon.includes('10X')) currentMultiplier = 10;
                    if(p.icon === '📷') cameraScale = 0.42; // Sniper scope zoom out

                    let badge = document.getElementById('multiplier-badge');
                    badge.innerText = `Active Power: ${p.icon}`;
                    badge.style.display = 'block';

                    powerups[i].x = Math.random() * MAP_SIZE;
                    powerups[i].y = Math.random() * MAP_SIZE;
                }
            });
        }

        // AGGRESSIVE BOTS + AUTO RESPAWN + GROWING
        bots.forEach(b => {
            if(!b.alive) return;

            // Bots eat fruits & grow
            fruits.forEach((f, fi) => {
                if(Math.hypot(b.x - f.x, b.y - f.y) < b.sizeRadius + 8) {
                    b.score += 5;
                    fruits[fi].x = Math.random() * MAP_SIZE;
                    fruits[fi].y = Math.random() * MAP_SIZE;
                    b.body.push({...b.body[b.body.length-1]});
                    if(b.body.length % 20 === 0) b.sizeRadius += 0.4;
                }
            });

            let distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);
            if(distToPlayer < 850 && player.alive) {
                b.circleAngle += 0.05;
                let targetX = player.x + Math.cos(b.circleAngle) * 170;
                let targetY = player.y + Math.sin(b.circleAngle) * 170;
                b.angle = Math.atan2(targetY - b.y, targetX - b.x);
            } else {
                b.angle += (Math.random() - 0.5) * 0.12;
            }

            b.x += Math.cos(b.angle) * 4.2;
            b.y += Math.sin(b.angle) * 4.2;
            b.body.unshift({x: b.x, y: b.y});
            b.body.pop();

            // Bot Dies if hits player -> Auto Respawn!
            player.body.forEach((pSeg, idx) => {
                if(idx > 2 && Math.hypot(b.x - pSeg.x, b.y - pSeg.y) < b.sizeRadius + 2) {
                    b.alive = false;
                    setTimeout(() => spawnBot(b.id), 3000); // Respawns in 3s
                }
            });
        });

        // CAMERA TRANSFORM
        const camX = canvas.width / 2 - player.x * cameraScale;
        const camY = canvas.height / 2 - player.y * cameraScale;

        ctx.fillStyle = '#0f131a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(camX, camY);
        ctx.scale(cameraScale, cameraScale);

        // GRID LINES
        ctx.strokeStyle = '#18202d'; ctx.lineWidth = 2;
        for(let x = 0; x < MAP_SIZE; x += 150) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
        }
        for(let y = 0; y < MAP_SIZE; y += 150) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
        }

        // RED ZONE BORDER
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 20;
        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

        // GARAGES
        garages.forEach(g => {
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(g.x - 120, g.y - 120, 240, 240);
            ctx.fillStyle = '#fff'; ctx.font = "bold 22px Arial";
            ctx.fillText("GARAGE 🚗", g.x - 60, g.y + 8);
        });

        // Draw Fruits & Coins
        fruits.forEach(f => { ctx.font = "24px Arial"; ctx.fillText(f.type, f.x, f.y); });
        coinItems.forEach(c => { ctx.font = "20px Arial"; ctx.fillText("🪙", c.x, c.y); });

        // Draw Power-ups
        powerups.forEach(p => {
            ctx.shadowColor = "#f1c40f"; ctx.shadowBlur = 12;
            ctx.font = "bold 28px Arial"; ctx.fillText(p.icon, p.x, p.y);
            ctx.shadowBlur = 0;
        });

        // Draw Player Snake
        if(player.alive) {
            player.body.forEach((p, i) => {
                if(i === 0) {
                    drawAnacondaHead(p, player.angle, '#00A859', player.sizeRadius);
                } else {
                    ctx.fillStyle = i % 2 === 0 ? '#00A859' : '#ffffff';
                    ctx.beginPath(); ctx.arc(p.x, p.y, player.sizeRadius * 0.7, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        // Draw Bots
        bots.forEach(b => {
            if(!b.alive) return;
            b.body.forEach((bp, j) => {
                if(j === 0) {
                    drawAnacondaHead(bp, b.angle, '#e74c3c', b.sizeRadius);
                } else {
                    ctx.fillStyle = j % 2 === 0 ? '#e74c3c' : '#f39c12';
                    ctx.beginPath(); ctx.arc(bp.x, bp.y, b.sizeRadius * 0.65, 0, Math.PI*2); ctx.fill();
                }
            });
        });

        ctx.restore();

        // Update Radar
        radarCtx.clearRect(0, 0, 75, 75);
        if(player.alive) {
            radarCtx.fillStyle = '#2ecc71'; radarCtx.beginPath();
            radarCtx.arc((player.x/MAP_SIZE)*75, (player.y/MAP_SIZE)*75, 3.5, 0, Math.PI*2); radarCtx.fill();
        }
        bots.forEach(b => {
            if(!b.alive) return;
            radarCtx.fillStyle = '#e74c3c'; radarCtx.beginPath();
            radarCtx.arc((b.x/MAP_SIZE)*75, (b.y/MAP_SIZE)*75, 2, 0, Math.PI*2); radarCtx.fill();
        });

        updateLeaderboard();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
