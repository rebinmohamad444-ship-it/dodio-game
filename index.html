<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dod.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #0f131a; }

        /* Radar Top Left */
        #radar-wrapper {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; z-index: 5;
        }
        #radar-canvas {
            width: 80px; height: 80px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2ecc71; border-radius: 50%;
        }
        #hud-stats {
            background: rgba(0,0,0,0.75); padding: 4px 8px;
            border-radius: 6px; border: 1px solid #2ecc71;
            font-size: 10px; margin-top: 4px; text-align: center;
        }

        /* Leaderboard Top Right */
        #leaderboard-box {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.85); padding: 8px 12px;
            border-radius: 8px; border: 1.5px solid #f1c40f;
            font-size: 11px; z-index: 5; min-width: 130px; pointer-events: none;
        }

        #multiplier-badge {
            position: absolute; top: 100px; left: 10px;
            background: rgba(241, 196, 15, 0.9); color: #111;
            padding: 3px 8px; border-radius: 12px; font-weight: bold;
            font-size: 11px; z-index: 5; display: none;
        }

        #menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }

        h1 { font-size: 38px; color: #2ecc71; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 260px; }
        button, select, input {
            padding: 9px; font-size: 12px; border-radius: 12px;
            border: 1.5px solid #2ecc71; background: #181c24; color: #fff; text-align: center; outline: none;
        }
        button { background: #2ecc71; color: #111; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>

<div id="radar-wrapper">
    <canvas id="radar-canvas" width="80" height="80"></canvas>
    <div id="hud-stats">
        <div>Score: <span id="scoreVal" style="color:#2ecc71;">0</span></div>
        <div>Coins: <span id="coinVal" style="color:#f1c40f;">🪙 0</span></div>
    </div>
</div>

<div id="multiplier-badge">⚡ 1X</div>

<div id="leaderboard-box">
    <h4 style="color:#f1c40f; text-align:center; margin-bottom:4px; font-size:11px;">🏆 TOP 10 PLAYERS</h4>
    <div id="topList"></div>
</div>

<div id="menu-overlay">
    <h1>dod.io</h1>
    <div style="font-size:30px; margin-bottom:8px;">🐍</div>
    
    <div class="btn-group">
        <input type="text" id="playerName" placeholder="Enter Player Name">
        
        <select id="skinSelect">
            <optgroup label="Regions / هەرێمەکان">
                <option value="kurdish">✌️ Kurdistan</option>
                <option value="catalonia">🟡🔴 Catalonia</option>
                <option value="scotland">🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland</option>
            </optgroup>
            <optgroup label="Countries / وڵاتان">
                <option value="brazil">🇧🇷 Brazil</option>
                <option value="argentina">🇦🇷 Argentina</option>
                <option value="germany">🇩🇪 Germany</option>
                <option value="france">🇫🇷 France</option>
                <option value="spain">🇪🇸 Spain</option>
                <option value="italy">🇮🇹 Italy</option>
                <option value="japan">🇯🇵 Japan</option>
                <option value="usa">🇺🇸 USA</option>
            </optgroup>
        </select>

        <button onclick="startGame()">PLAY GAME 🎮</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    const MAP_SIZE = 12000;
    const CAMERA_SCALE = 0.65;
    let gameRunning = false;
    let score = 0, coins = 0;
    
    let currentMultiplier = 1;
    let player = { x: MAP_SIZE/2, y: MAP_SIZE/2, angle: 0, targetAngle: 0, skin: 'kurdish', body: [], alive: true };
    let bots = [];
    let fruits = [];
    let coinItems = [];
    let powerups = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function startGame() {
        player.skin = document.getElementById('skinSelect').value;
        document.getElementById('menu-overlay').style.display = 'none';
        gameRunning = true;
        initGame();
        gameLoop();
    }

    function initGame() {
        player.alive = true;
        player.x = MAP_SIZE/2; player.y = MAP_SIZE/2;
        player.body = [];
        for(let i=0; i<30; i++) player.body.push({x: player.x - i*6, y: player.y});

        // Exactly 10 Aggressive Bots
        bots = [];
        for(let i=0; i<10; i++) spawnBot(i);

        // 3X Fruits (3600 Items)
        fruits = [];
        const fTypes = ['🍌', '🍉', '🍒', '🍎', '🍓'];
        for(let i=0; i<3600; i++) {
            fruits.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, type: fTypes[Math.floor(Math.random()*fTypes.length)] });
        }

        // 3X Coins (1200 Items)
        coinItems = [];
        for(let i=0; i<1200; i++) coinItems.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE });

        // 3X Power-ups & Multipliers
        powerups = [];
        const pTypes = ['2x', '4x', '6x', '10x', 'magnet'];
        for(let i=0; i<200; i++) {
            powerups.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, type: pTypes[Math.floor(Math.random()*pTypes.length)] });
        }
    }

    function spawnBot(id) {
        let bx = Math.random() * (MAP_SIZE - 2000) + 1000;
        let by = Math.random() * (MAP_SIZE - 2000) + 1000;
        let body = [];
        for(let j=0; j<25; j++) body.push({x: bx - j*6, y: by});
        const botNames = ['Pro_Snake', 'Viper_X', 'Anaconda_CN', 'Shadow_99', 'Kurd_King', 'Hunter', 'Toxic_Bite', 'Speedy', 'Alpha_Bot', 'Slayer'];
        bots[id] = { id, name: botNames[id], x: bx, y: by, angle: Math.random()*Math.PI*2, body, score: Math.floor(Math.random()*600+100), alive: true, circleAngle: 0 };
    }

    function handlePointer(e) {
        if(!gameRunning || !player.alive) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.targetAngle = Math.atan2(cy - canvas.height/2, cx - canvas.width/2);
    }
    window.addEventListener('touchmove', handlePointer);
    window.addEventListener('mousemove', handlePointer);

    function drawAnacondaHead(p, angle, mainColor) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        
        // Chinese Anaconda Oval Head
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Slanted Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6, -6, 3, 0, Math.PI * 2);
        ctx.arc(6, 6, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(7, -6, 1.5, 0, Math.PI * 2);
        ctx.arc(7, 6, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Forked Red Tongue
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(16, 0); ctx.lineTo(24, 0);
        ctx.lineTo(27, -3); ctx.moveTo(24, 0); ctx.lineTo(27, 3);
        ctx.stroke();

        ctx.restore();
    }

    function updateLeaderboard() {
        let list = [{ name: document.getElementById('playerName').value || "Player", score: score }];
        bots.forEach(b => { if(b.alive) list.push({ name: b.name, score: b.score }); });
        list.sort((a, b) => b.score - a.score);

        let html = "";
        list.slice(0, 10).forEach((item, idx) => {
            let isPlayer = item.name === (document.getElementById('playerName').value || "Player");
            html += `<div style="color:${isPlayer ? '#2ecc71' : '#fff'}; font-weight:${isPlayer ? 'bold' : 'normal'}">${idx+1}. ${item.name} - ${item.score}</div>`;
        });
        document.getElementById('topList').innerHTML = html;
    }

    function gameLoop() {
        if(!gameRunning) return;

        if(player.alive) {
            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            player.angle += diff * 0.12;

            player.x += Math.cos(player.angle) * 3.8;
            player.y += Math.sin(player.angle) * 3.8;
            player.body.unshift({x: player.x, y: player.y});
            player.body.pop();

            // Eat Fruits
            fruits.forEach((f, i) => {
                if(Math.hypot(player.x - f.x, player.y - f.y) < 25) {
                    score += 5 * currentMultiplier;
                    document.getElementById('scoreVal').innerText = score;
                    fruits[i].x = Math.random() * MAP_SIZE;
                    fruits[i].y = Math.random() * MAP_SIZE;
                    player.body.push({...player.body[player.body.length-1]});
                }
            });

            // Eat Coins
            coinItems.forEach((c, i) => {
                if(Math.hypot(player.x - c.x, player.y - c.y) < 22) {
                    coins += 1;
                    document.getElementById('coinVal').innerText = `🪙 ${coins}`;
                    coinItems[i].x = Math.random() * MAP_SIZE;
                    coinItems[i].y = Math.random() * MAP_SIZE;
                }
            });
        }

        // AGGRESSIVE BOTS: Circling Around Player!
        bots.forEach(b => {
            if(!b.alive) return;

            let distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);

            if(distToPlayer < 900 && player.alive) {
                // Circle around player
                b.circleAngle += 0.05;
                let targetX = player.x + Math.cos(b.circleAngle) * 180;
                let targetY = player.y + Math.sin(b.circleAngle) * 180;
                b.angle = Math.atan2(targetY - b.y, targetX - b.x);
            } else {
                b.angle += (Math.random() - 0.5) * 0.1;
            }

            b.x += Math.cos(b.angle) * 3.6;
            b.y += Math.sin(b.angle) * 3.6;
            b.body.unshift({x: b.x, y: b.y});
            b.body.pop();
        });

        // Camera Transformation
        const camX = canvas.width / 2 - player.x * CAMERA_SCALE;
        const camY = canvas.height / 2 - player.y * CAMERA_SCALE;

        ctx.fillStyle = '#0f131a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(camX, camY);
        ctx.scale(CAMERA_SCALE, CAMERA_SCALE);

        // Map Border
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 15;
        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

        // Draw Fruits & Coins
        fruits.forEach(f => { ctx.font = "22px Arial"; ctx.fillText(f.type, f.x, f.y); });
        coinItems.forEach(c => { ctx.font = "20px Arial"; ctx.fillText("🪙", c.x, c.y); });

        // Draw Player Snake
        if(player.alive) {
            player.body.forEach((p, i) => {
                if(i === 0) {
                    drawAnacondaHead(p, player.angle, '#00A859');
                } else {
                    ctx.fillStyle = i % 2 === 0 ? '#00A859' : '#ffffff';
                    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        // Draw Bots with Chinese Anaconda Heads
        bots.forEach(b => {
            if(!b.alive) return;
            b.body.forEach((bp, j) => {
                if(j === 0) {
                    drawAnacondaHead(bp, b.angle, '#e74c3c');
                } else {
                    ctx.fillStyle = j % 2 === 0 ? '#e74c3c' : '#f39c12';
                    ctx.beginPath(); ctx.arc(bp.x, bp.y, 8, 0, Math.PI*2); ctx.fill();
                }
            });
        });

        ctx.restore();

        // Update Radar
        radarCtx.clearRect(0, 0, 80, 80);
        if(player.alive) {
            radarCtx.fillStyle = '#2ecc71'; radarCtx.beginPath();
            radarCtx.arc((player.x/MAP_SIZE)*80, (player.y/MAP_SIZE)*80, 3.5, 0, Math.PI*2); radarCtx.fill();
        }
        bots.forEach(b => {
            if(!b.alive) return;
            radarCtx.fillStyle = '#e74c3c'; radarCtx.beginPath();
            radarCtx.arc((b.x/MAP_SIZE)*80, (b.y/MAP_SIZE)*80, 2, 0, Math.PI*2); radarCtx.fill();
        });

        updateLeaderboard();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
