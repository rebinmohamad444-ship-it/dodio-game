<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Tank Battle Strategy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050508;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .hud-header {
            background: rgba(10, 15, 30, 0.75);
            border: 1px solid rgba(0, 255, 200, 0.3);
            padding: 10px 15px;
            border-radius: 8px;
            color: #00ffcc;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            backdrop-filter: blur(5px);
        }
        .controls-hint {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            align-self: center;
            text-align: center;
        }
    </style>
    <!-- Loading Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="hud-header">
            <span>🎮 STATUS: ONLINE</span>
            <span>🚀 3D ENGINE: READY</span>
        </div>
        <div class="controls-hint">
            📱 پەنجە بەردە سەر شاشەکە بۆ بەڕێوەبردنی تانک و جوڵاندنی کامێرا
        </div>
    </div>

    <script>
        // --- 1. SETUP SCENE, CAMERA, & RENDERER ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a14);
        scene.fog = new THREE.FogExp2(0x0a0a14, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- 3. GROUND / BATTLEFIELD GRID ---
        const gridHelper = new THREE.GridHelper(60, 30, 0x00ffcc, 0x1f293d);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const groundGeo = new THREE.PlaneGeometry(60, 60);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111625, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- 4. TANK CREATION (3D OBJECT) ---
        function createTank(colorHex) {
            const tankGroup = new THREE.Group();

            // Tank Body
            const bodyGeo = new THREE.BoxGeometry(2.2, 0.8, 3);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.5, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            tankGroup.add(body);

            // Tank Turret
            const turretGeo = new THREE.BoxGeometry(1.4, 0.6, 1.4);
            const turretMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7 });
            const turret = new THREE.Mesh(turretGeo, turretMat);
            turret.position.set(0, 1.1, -0.2);
            turret.castShadow = true;
            tankGroup.add(turret);

            // Tank Cannon
            const cannonGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.8);
            const cannonMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const cannon = new THREE.Mesh(cannonGeo, cannonMat);
            cannon.rotation.x = Math.PI / 2;
            cannon.position.set(0, 1.1, 0.8);
            cannon.castShadow = true;
            tankGroup.add(cannon);

            return tankGroup;
        }

        // Add Player Tank
        const playerTank = createTank(0x00ffaa);
        playerTank.position.set(0, 0, 0);
        scene.add(playerTank);

        // Add Target Marker
        const markerGeo = new THREE.RingGeometry(0.5, 0.7, 32);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide });
        const targetMarker = new THREE.Mesh(markerGeo, markerMat);
        targetMarker.rotation.x = -Math.PI / 2;
        targetMarker.position.y = 0.02;
        targetMarker.visible = false;
        scene.add(targetMarker);

        // --- 5. CONTROLS & INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetPosition = null;
        const speed = 0.12;

        function handlePointer(event) {
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);

            if (!clientX || !clientY) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
                targetPosition = intersects[0].point;
                targetMarker.position.set(targetPosition.x, 0.02, targetPosition.z);
                targetMarker.visible = true;
            }
        }

        window.addEventListener('click', handlePointer);
        window.addEventListener('touchstart', handlePointer);

        // --- 6. GAME LOOP & ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);

            // Move Tank smoothly towards target position
            if (targetPosition) {
                const distance = playerTank.position.distanceTo(targetPosition);
                if (distance > 0.3) {
                    const dir = new THREE.Vector3().subVectors(targetPosition, playerTank.position).normalize();
                    playerTank.position.addScaledVector(dir, speed);
                    playerTank.lookAt(targetPosition.x, playerTank.position.y, targetPosition.z);
                } else {
                    targetMarker.visible = false;
                }
            }

            // Smoothly move camera with player tank
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerTank.position.x, 0.05);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, playerTank.position.z + 25, 0.05);

            renderer.render(scene, camera);
        }

        animate();

        // --- 7. RESPONSIVE RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
